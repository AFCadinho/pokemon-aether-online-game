  <!-- Center emblem -->
  <circle cx="512" cy="512" r="98" fill="#1f1a17"/>
  <circle cx="512" cy="512" r="70" fill="#ffffff"/>
  <path d="M442 512 H582" stroke="#1f1a17" stroke-width="22" stroke-linecap="butt"/>
  <circle cx="512" cy="512" r="40" fill="#ffffff" stroke="#1f1a17" stroke-width="12"/>
</svg>
