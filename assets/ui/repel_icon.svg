<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repel item icon">
  <defs>
    <linearGradient id="bottleGradient" x1="36" y1="34" x2="91" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE3FF"/>
      <stop offset="0.55" stop-color="#2FA8E8"/>
      <stop offset="1" stop-color="#1762B8"/>
    </linearGradient>

    <linearGradient id="capGradient" x1="46" y1="14" x2="82" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#AAB6C2"/>
    </linearGradient>

    <linearGradient id="labelGradient" x1="39" y1="62" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4A3"/>
      <stop offset="1" stop-color="#FFB43B"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Spray particles -->
  <circle cx="98" cy="21" r="4" fill="#8EEAFF" opacity="0.95"/>
  <circle cx="111" cy="31" r="3" fill="#8EEAFF" opacity="0.75"/>
  <circle cx="101" cy="43" r="2.5" fill="#8EEAFF" opacity="0.6"/>
  <path d="M82 29 L103 15" stroke="#8EEAFF" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M84 35 L111 35" stroke="#8EEAFF" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- Bottle -->
  <g filter="url(#shadow)">
    <!-- Nozzle -->
    <path d="M61 13H78C82 13 85 16 85 20V25H68V22H58V18C58 15 59 13 61 13Z" fill="url(#capGradient)" stroke="#31445A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M80 18H95C98 18 100 20 100 23V27H84V25H80V18Z" fill="#DDE5EC" stroke="#31445A" stroke-width="4" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="50" y="28" width="28" height="17" rx="5" fill="#DDE5EC" stroke="#31445A" stroke-width="4"/>

    <!-- Main bottle -->
    <path d="M43 43H83C89 43 94 48 94 54V104C94 111 88 117 81 117H45C38 117 32 111 32 104V54C32 48 37 43 43 43Z" fill="url(#bottleGradient)" stroke="#24384F" stroke-width="5" stroke-linejoin="round"/>

    <!-- Highlight -->
    <path d="M45 51C40 54 39 60 39 66V99C39 104 42 108 47 109" fill="none" stroke="#BFF5FF" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

    <!-- Label -->
    <path d="M43 65H83C87 65 90 68 90 72V91C90 95 87 98 83 98H43C39 98 36 95 36 91V72C36 68 39 65 43 65Z" fill="url(#labelGradient)" stroke="#24384F" stroke-width="4"/>

    <!-- Label text -->
    <text x="63" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#24384F">REPEL</text>

    <!-- Small monster-away symbol -->
    <path d="M54 76C57 72 64 72 67 76C70 72 77 72 80 76" fill="none" stroke="#24384F" stroke-width="3" stroke-linecap="round"/>
    <path d="M49 92L77 68" stroke="#E84949" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
