<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35b8ff"/>
      <stop offset="0.55" stop-color="#2368d9"/>
      <stop offset="1" stop-color="#14215b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cfd8e6"/>
      <stop offset="0.7" stop-color="#8e9aae"/>
      <stop offset="1" stop-color="#4a5368"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff19a"/>
      <stop offset="0.45" stop-color="#ffc438"/>
      <stop offset="1" stop-color="#d77a10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Transparent background -->

  <g filter="url(#shadow)">
    <!-- shield base -->
    <path d="M64 8 L106 23 V55 C106 83 88 106 64 119 C40 106 22 83 22 55 V23 Z"
          fill="url(#blue)" stroke="#06101f" stroke-width="7" stroke-linejoin="round"/>
    <path d="M64 17 L96 29 V55 C96 77 83 96 64 108 C45 96 32 77 32 55 V29 Z"
          fill="none" stroke="#79d6ff" stroke-width="3" opacity="0.75"/>

    <!-- crossed tools -->
    <g stroke="#07101d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <!-- wrench silhouette -->
      <path d="M39 88 L75 52 C72 44 74 35 81 29 C86 25 92 24 97 26 L87 36 L92 41 L102 31 C104 37 102 44 97 49 C91 55 82 57 74 54 L45 94 Z"
            fill="url(#metal)"/>
      <!-- hammer -->
      <path d="M89 91 L55 57" fill="none" stroke="#07101d" stroke-width="15"/>
      <path d="M89 91 L55 57" fill="none" stroke="url(#gold)" stroke-width="9"/>
      <path d="M42 43 L55 30 L73 48 L60 61 Z" fill="url(#metal)"/>
    </g>

    <!-- center badge -->
    <circle cx="64" cy="66" r="18" fill="#0b1730" stroke="#07101d" stroke-width="5"/>
    <path d="M64 50 L68 61 L80 62 L70 69 L73 81 L64 74 L55 81 L58 69 L48 62 L60 61 Z"
          fill="url(#gold)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>

    <!-- highlights -->
    <path d="M39 32 C48 27 55 24 64 22" stroke="#b8ecff" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M83 28 L91 31" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
