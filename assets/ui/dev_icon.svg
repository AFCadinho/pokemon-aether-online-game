<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer icon">
  <defs>
    <linearGradient id="bgGradient" x1="24" y1="20" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#323C52"/>
      <stop offset="0.55" stop-color="#1A2233"/>
      <stop offset="1" stop-color="#0E1320"/>
    </linearGradient>

    <linearGradient id="screenGradient" x1="34" y1="34" x2="94" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1EFB9A"/>
      <stop offset="1" stop-color="#10A6FF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badge background -->
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="92" height="92" rx="24" fill="url(#bgGradient)" stroke="#4B5F7A" stroke-width="4"/>

    <!-- Terminal window -->
    <rect x="31" y="34" width="66" height="55" rx="8" fill="#111827" stroke="#6C7E96" stroke-width="4"/>
    <rect x="31" y="34" width="66" height="14" rx="8" fill="#263247"/>
    <path d="M31 48H97" stroke="#6C7E96" stroke-width="3"/>

    <!-- Window dots -->
    <circle cx="42" cy="41" r="2.5" fill="#FF5F57"/>
    <circle cx="51" cy="41" r="2.5" fill="#FFBD2E"/>
    <circle cx="60" cy="41" r="2.5" fill="#28C840"/>

    <!-- Code brackets -->
    <path d="M53 59L43 69L53 79" fill="none" stroke="url(#screenGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M75 59L85 69L75 79" fill="none" stroke="url(#screenGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M67 57L60 81" fill="none" stroke="#E9F7FF" stroke-width="5" stroke-linecap="round"/>

    <!-- DEV label -->
    <rect x="37" y="93" width="54" height="18" rx="7" fill="#F2C94C" stroke="#1B2433" stroke-width="4"/>
    <text x="64" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#1B2433">DEV</text>
  </g>
</svg>
