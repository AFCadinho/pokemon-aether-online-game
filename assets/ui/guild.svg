<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="roof" x1="90" y1="60" x2="420" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffdf75"/>
      <stop offset="55%" stop-color="#d68a25"/>
      <stop offset="100%" stop-color="#8e4812"/>
    </linearGradient>
    <linearGradient id="wall" x1="120" y1="170" x2="390" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#79c8ff"/>
      <stop offset="55%" stop-color="#2f73df"/>
      <stop offset="100%" stop-color="#173680"/>
    </linearGradient>
    <linearGradient id="stone" x1="140" y1="260" x2="360" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="100%" stop-color="#9ca9bf"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14233f"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- transparent background -->

  <g filter="url(#shadow)" stroke="url(#dark)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- main building -->
    <path d="M118 218 H394 V428 H118 Z" fill="url(#wall)"/>

    <!-- roof -->
    <path d="M74 218 L256 72 L438 218 Z" fill="url(#roof)"/>
    <path d="M112 218 L256 106 L400 218 Z" fill="#ffd97a" opacity="0.25"/>

    <!-- side towers -->
    <path d="M84 260 H150 V428 H84 Z" fill="#2451a6"/>
    <path d="M362 260 H428 V428 H362 Z" fill="#2451a6"/>
    <path d="M70 260 L117 214 L164 260 Z" fill="url(#roof)"/>
    <path d="M348 260 L395 214 L442 260 Z" fill="url(#roof)"/>

    <!-- sign crest -->
    <path d="M256 150 L285 190 L256 230 L227 190 Z" fill="#7be2ff"/>
    <path d="M256 165 L273 190 L256 215 L239 190 Z" fill="#ffffff" opacity="0.8"/>

    <!-- door -->
    <path d="M206 428 V322 C206 292 306 292 306 322 V428 Z" fill="url(#stone)"/>
    <path d="M256 306 V428" stroke="#6e7b8f" stroke-width="10" opacity="0.65"/>
    <circle cx="238" cy="374" r="7" fill="#f5b92e" stroke="#071024" stroke-width="6"/>
    <circle cx="274" cy="374" r="7" fill="#f5b92e" stroke="#071024" stroke-width="6"/>

    <!-- windows -->
    <rect x="146" y="270" width="48" height="54" rx="10" fill="#9eeaff"/>
    <rect x="318" y="270" width="48" height="54" rx="10" fill="#9eeaff"/>
    <path d="M170 270 V324 M146 297 H194" stroke="#173680" stroke-width="7"/>
    <path d="M342 270 V324 M318 297 H366" stroke="#173680" stroke-width="7"/>

    <!-- base -->
    <path d="M70 428 H442 V462 H70 Z" fill="#56647a"/>
  </g>

  <!-- highlights -->
  <path d="M132 233 H350" fill="none" stroke="#9bd9ff" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <path d="M122 211 L256 103 L390 211" fill="none" stroke="#fff0b0" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
</svg>