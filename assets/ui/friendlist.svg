<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Friends">
  <defs>
    <linearGradient id="friends-back" x1="66" y1="29" x2="103" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50779C"/>
      <stop offset="1" stop-color="#213B57"/>
    </linearGradient>
    <linearGradient id="friends-front" x1="29" y1="24" x2="77" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BE5FF"/>
      <stop offset="1" stop-color="#2C93D5"/>
    </linearGradient>
    <filter id="friends-shadow" x="9" y="8" width="110" height="113" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#050B14" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#friends-shadow)" stroke-linejoin="round">
    <!-- Friend in the background -->
    <circle cx="83" cy="43" r="17" fill="url(#friends-back)" stroke="#D8DEE9" stroke-width="4"/>
    <path d="M57 101C58 78 68 66 83 66C99 66 109 78 110 101H57Z" fill="url(#friends-back)" stroke="#D8DEE9" stroke-width="4"/>

    <!-- Primary friend -->
    <circle cx="48" cy="39" r="20" fill="url(#friends-front)" stroke="#F4F8FC" stroke-width="4"/>
    <path d="M18 105C19 79 30 65 48 65C66 65 77 79 78 105H18Z" fill="url(#friends-front)" stroke="#F4F8FC" stroke-width="4"/>
    <path d="M37 32C43 27 51 27 58 32" stroke="#DFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M31 94C35 85 41 81 48 81" stroke="#DFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

    <!-- Shared connection -->
    <path d="M63 58C69 54 75 54 80 58" stroke="#D8B767" stroke-width="5" stroke-linecap="round"/>
    <circle cx="96" cy="27" r="10" fill="#162A41" stroke="#D8B767" stroke-width="3"/>
    <path d="M96 21V33M90 27H102" stroke="#FFF1B8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
