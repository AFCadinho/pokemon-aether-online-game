<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>PokeAether · Browser</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #060b16; color: #f5f1ff; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #060b16; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #cover { position: fixed; inset: 0; display: grid; place-items: center; overflow: auto; padding: 28px 18px; background: radial-gradient(circle at 50% 22%, #34285c 0, #131a31 38%, #060b16 78%); }
    #cover::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .25; background: linear-gradient(115deg, transparent 20%, #9874ff18 50%, transparent 80%); }
    #cover[hidden] { display: none; }
    main { position: relative; width: min(520px, 100%); overflow: hidden; text-align: center; border: 1px solid #66558e; border-radius: 26px; background: linear-gradient(160deg, #111a31f5, #090f1ff5); box-shadow: 0 30px 90px #0009, inset 0 1px #ffffff0d; }
    main::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 0, #a881ff15, transparent 48%); }
    .world-preview { position: relative; height: 188px; margin: 0; overflow: hidden; border-bottom: 1px solid #66558e80; }
    .world-preview::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, #0e172d 100%); }
    .world-preview img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 52%; image-rendering: auto; }
    .launch-content { padding: 0 42px 30px; }
    .brand-logo { position: relative; z-index: 1; display: block; width: clamp(132px, 34vw, 172px); height: auto; margin: -76px auto -2px; filter: drop-shadow(0 15px 28px #000a); }
    .browser-label { position: relative; z-index: 1; display: inline-block; margin-bottom: 12px; padding: 6px 12px; color: #d9ccff; background: #a881ff17; border: 1px solid #9e7be950; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { position: relative; z-index: 1; font-size: clamp(30px, 7vw, 42px); margin: 0 0 8px; letter-spacing: -.035em; }
    p { position: relative; z-index: 1; line-height: 1.5; color: #bfc9df; }
    #release-description { margin: 0 0 24px; font-size: 17px; }
    button { position: relative; z-index: 1; width: 100%; font: inherit; font-size: 17px; font-weight: 800; color: #0b1020; background: linear-gradient(135deg, #d3c2ff, #8dcfff); border: 0; border-radius: 12px; padding: 15px 22px; cursor: pointer; box-shadow: 0 10px 28px #6c6bff2e; transition: transform .15s ease, filter .15s ease; }
    button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
    button:disabled { opacity: .65; cursor: wait; }
    button:focus-visible { outline: 3px solid #f7ce77; outline-offset: 4px; }
    .client-note { margin: 15px 0 0; font-size: 14px; }
    .client-note a { font-weight: 750; }
    progress { position: relative; z-index: 1; display: block; width: 100%; height: 7px; margin: 22px 0 8px; accent-color: #a98cff; }
    progress[hidden] { display: none; }
    #status { min-height: 1.5em; margin: 14px 0 0; font-size: 13px; color: #9caac2; }
    dialog { width: min(540px, 94vw); max-height: 90vh; border: 1px solid #53627a; border-radius: 16px; background: #0a1424; color: #edf4ff; padding: 28px; }
    dialog::backdrop { background: #000b; }
    label { display: block; margin: 14px 0; line-height: 1.5; }
    input:not([type=checkbox]), select { display: block; width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #53627a; border-radius: 6px; background: #15243a; color: white; font: inherit; }
    a { color: #91ceff; }
    .actions { display: flex; gap: 12px; }
    @media (max-width: 520px), (max-height: 650px) {
      #cover { padding: 16px; }
      .world-preview { height: min(164px, 27vh); }
      .launch-content { padding: 0 24px 22px; }
      .brand-logo { width: min(145px, 27vh); margin-top: -62px; }
    }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="PokeAether game"></canvas>
  <div id="cover">
    <main>
      <figure class="world-preview" aria-hidden="true"><img src="pokeaether-world-preview.webp" alt=""></figure>
      <div class="launch-content">
        <img class="brand-logo" src="pokeaether-logo.webp" alt="">
        <div class="browser-label">Browser game</div>
        <h1>Play PokeAether</h1>
        <p id="release-description">No download needed.</p>
        <button id="start" type="button">Play now</button>
        <p class="client-note">Smoother play and better graphics: <a href="https://pokeaether.com/download" target="_blank" rel="noopener noreferrer">game client</a>.</p>
        <progress id="progress" hidden></progress>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
  </div>
  <dialog id="registration" aria-labelledby="registration-title">
    <form id="registration-form">
      <h2 id="registration-title">Create your PokeAether account</h2>
      <p>The same account works in the desktop game. Verify your email before signing in.</p>
      <p id="register-status" role="status" aria-live="polite"></p>
      <label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+"></label>
      <label>Email<input name="email" autocomplete="email" type="email" required maxlength="254"></label>
      <label>Password<input name="password" autocomplete="new-password" type="password" required minlength="8" maxlength="128"></label>
      <label>Confirm password<input name="confirmPassword" autocomplete="new-password" type="password" required></label>
      <label>Character gender<select name="gender"><option value="male">Male</option><option value="female">Female</option></select></label>
      <label><input name="age" type="checkbox" required> I am at least 13 years old and, if under 18, have permission from a parent or legal guardian.</label>
      <label><input name="legal" type="checkbox" required> I accept the <a href="https://pokeaether.com/terms" target="_blank" rel="noopener noreferrer">Terms</a> and <a href="https://pokeaether.com/code-of-conduct" target="_blank" rel="noopener noreferrer">Code of Conduct</a>, and acknowledge the <a href="https://pokeaether.com/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</label>
      <div class="actions"><button id="register-submit">Create account</button><button id="register-close" type="button">Back to login</button></div>
    </form>
  </dialog>
  <!-- POKEAETHER_RELEASE_CONFIG -->
  <script id="pokeaether-fullscreen">
    (() => {
      const canvas = document.getElementById('canvas');
      const retry = document.createElement('button');
      retry.textContent = 'Enter fullscreen';
      retry.hidden = true;
      retry.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:auto;z-index:1000';
      document.body.appendChild(retry);
      let error = '';
      const supported = () => Boolean(document.fullscreenEnabled && canvas.requestFullscreen);
      const active = () => document.fullscreenElement === canvas;
      const request = enabled => {
        error = '';
        retry.hidden = true;
        if (enabled && !supported()) {
          error = 'Fullscreen is not available in this browser.';
          return;
        }
        if (enabled === active()) return;
        if (enabled && navigator.userActivation && !navigator.userActivation.isActive) {
          retry.hidden = false;
          return;
        }
        // Call before any await: fullscreen requires a recent user gesture.
        try {
          const operation = enabled ? canvas.requestFullscreen() : document.exitFullscreen();
          Promise.resolve(operation).catch(() => {
            error = 'Fullscreen could not be enabled. Use the fullscreen button to retry.';
            retry.hidden = !enabled;
          });
        } catch (_) {
          error = 'Fullscreen could not be enabled.';
          retry.hidden = !enabled;
        }
      };
      retry.addEventListener('click', () => request(true));
      document.addEventListener('fullscreenchange', () => {
        retry.hidden = true;
        error = '';
        canvas.focus();
        window.dispatchEvent(new Event('resize'));
      });
      window.pokeaetherFullscreen = {request, supported, active, error: () => error};
    })();
  </script>
  <script src="$GODOT_URL"></script>
  <script>
    const webRelease = window.POKEAETHER_WEB_RELEASE || null;
    const releaseAssetUrl = relativePath => webRelease
      ? webRelease.assetBaseUrl + '/' + relativePath.replace(/^\/+/, '')
      : '/' + relativePath.replace(/^\/+/, '');
    const audioDebugEnabled = new URLSearchParams(location.search).has('audio-debug');
    const audioDebugEvents = [];
    const recordAudioDebug = (event, details = {}) => {
      const entry = { at: new Date().toISOString(), event, ...details };
      audioDebugEvents.push(entry);
      if (audioDebugEnabled) console.info('[PokeAether audio]', entry);
      return entry;
    };
    window.pokeaetherAudioDiagnostics = {
      events: audioDebugEvents,
      record: recordAudioDebug,
      enabled: audioDebugEnabled,
    };
    // A Godot WebAudio worklet can initialise successfully while sending only
    // zero-valued blocks to its destination. Keep desktop on Godot's mixer,
    // but use the browser's media implementation for Web exports. Source
    // files are copied by build_web_preview.py under this same origin.
    const browserAudioPath = resourcePath => {
      const prefix = 'res://assets/';
      if (typeof resourcePath !== 'string' || !resourcePath.startsWith(prefix)) return '';
      return releaseAssetUrl(webRelease ? 'web/releases/' + webRelease.buildId + '/browser-audio/' + resourcePath.slice(prefix.length)
        .split('/').map(segment => encodeURIComponent(segment)).join('/')
        : 'browser-audio/' + resourcePath.slice(prefix.length)
        .split('/').map(segment => encodeURIComponent(segment)).join('/'));
    };
    const clampVolume = value => Math.max(0, Math.min(1, Number(value) || 0));
    let nativeMusic = null;
    let nativeMusicPath = '';
    let nativeMusicVolume = 0;
    let nativeMusicPending = false;
    const startNativeMusic = () => {
      if (!nativeMusic) return;
      nativeMusic.volume = nativeMusicVolume;
      const play = nativeMusic.play();
      if (!play || typeof play.then !== 'function') return;
      play.then(() => {
        nativeMusicPending = false;
        recordAudioDebug('native-music-playing', { track: nativeMusicPath, volume: nativeMusic.volume });
      }).catch(error => {
        nativeMusicPending = true;
        recordAudioDebug('native-music-deferred', { track: nativeMusicPath, message: String(error?.message || error) });
      });
    };
    window.pokeaetherBrowserAudio = {
      playMusic(resourcePath, volume) {
        const source = browserAudioPath(resourcePath);
        if (!source) return;
        nativeMusicVolume = clampVolume(volume);
        if (nativeMusicPath !== resourcePath) {
          if (nativeMusic) nativeMusic.pause();
          nativeMusic = new Audio(source);
          if (webRelease) nativeMusic.crossOrigin = 'anonymous';
          nativeMusic.preload = 'auto';
          nativeMusic.loop = true;
          nativeMusicPath = resourcePath;
        }
        startNativeMusic();
      },
      stopMusic() {
        nativeMusicPending = false;
        if (nativeMusic) nativeMusic.pause();
      },
      setMusicVolume(volume) {
        nativeMusicVolume = clampVolume(volume);
        if (nativeMusic) nativeMusic.volume = nativeMusicVolume;
      },
      playSfx(resourcePath, volume, pitch = 1) {
        const source = browserAudioPath(resourcePath);
        if (!source) return;
        const effect = new Audio(source);
        if (webRelease) effect.crossOrigin = 'anonymous';
        effect.preload = 'auto';
        effect.volume = clampVolume(volume);
        effect.playbackRate = Math.max(.25, Math.min(4, Number(pitch) || 1));
        effect.addEventListener('ended', () => effect.remove(), { once: true });
        const play = effect.play();
        if (play && typeof play.catch === 'function') {
          play.catch(error => recordAudioDebug('native-sfx-deferred', {
            track: resourcePath, message: String(error?.message || error),
          }));
        }
      },
      unlock() {
        if (nativeMusicPending) startNativeMusic();
      },
    };
    let webAudioContext = null;
    const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
    const NativeAudioWorkletNode = window.AudioWorkletNode;
    if (NativeAudioWorkletNode) {
      // Observe the final Godot mixer node without taking ownership of it.
      // A silent browser build can otherwise look healthy up through stream
      // loading while its worklet never reaches the hardware destination.
      const tracedAudioWorkletNode = function (context, processorName, options) {
        const node = new NativeAudioWorkletNode(context, processorName, options);
        let lastAudioChunkReportAt = -Infinity;
        recordAudioDebug('worklet-node-created', {
          processor: processorName,
          outputChannels: options?.outputChannelCount || [],
        });
        try {
          const nativeConnect = node.connect.bind(node);
          node.connect = (...targets) => {
            recordAudioDebug('worklet-node-connected', {
              processor: processorName,
              target: targets[0]?.constructor?.name || 'unknown',
            });
            return nativeConnect(...targets);
          };
        } catch (error) {
          recordAudioDebug('worklet-connect-trace-unavailable', {
            message: String(error?.message || error),
          });
        }
        try {
          const nativePostMessage = node.port.postMessage.bind(node.port);
          node.port.postMessage = message => {
            const command = message?.cmd;
            if (command === 'start' || command === 'start_nothreads') {
              recordAudioDebug('worklet-start-requested', { processor: processorName, command });
            } else if (command === 'chunk' && performance.now() - lastAudioChunkReportAt >= 1000) {
              lastAudioChunkReportAt = performance.now();
              const samples = message.data;
              let peak = 0;
              if (samples?.length) {
                for (let index = 0; index < samples.length; index += 1) {
                  peak = Math.max(peak, Math.abs(samples[index]));
                }
              }
              recordAudioDebug('worklet-audio-chunk', {
                processor: processorName,
                samples: samples?.length || 0,
                peak: Number(peak.toFixed(6)),
              });
            }
            return nativePostMessage(message);
          };
        } catch (error) {
          recordAudioDebug('worklet-port-trace-unavailable', {
            message: String(error?.message || error),
          });
        }
        return node;
      };
      tracedAudioWorkletNode.prototype = NativeAudioWorkletNode.prototype;
      Object.setPrototypeOf(tracedAudioWorkletNode, NativeAudioWorkletNode);
      window.AudioWorkletNode = tracedAudioWorkletNode;
    }
    if (NativeAudioContext) {
      // Track Godot's own audio context. It chooses the sample rate and
      // latency settings required by its AudioWorklet mixer, so never hand it
      // a context created by the shell.
      const sharedAudioContext = function (...args) {
        webAudioContext = new NativeAudioContext(...args);
        recordAudioDebug('context-created', {
          state: webAudioContext.state,
          sampleRate: webAudioContext.sampleRate,
          hasAudioWorklet: Boolean(webAudioContext.audioWorklet),
        });
        webAudioContext.addEventListener('statechange', () => {
          recordAudioDebug('context-state', { state: webAudioContext.state });
        });
        const audioWorklet = webAudioContext.audioWorklet;
        if (audioWorklet) {
          try {
            const nativeAddModule = audioWorklet.addModule.bind(audioWorklet);
            audioWorklet.addModule = async moduleUrl => {
              recordAudioDebug('worklet-module-loading', { module: String(moduleUrl) });
              try {
                const result = await nativeAddModule(moduleUrl);
                recordAudioDebug('worklet-module-loaded', { module: String(moduleUrl) });
                return result;
              } catch (error) {
                recordAudioDebug('worklet-module-failed', {
                  module: String(moduleUrl), message: String(error?.message || error),
                });
                throw error;
              }
            };
          } catch (error) {
            recordAudioDebug('worklet-module-trace-unavailable', {
              message: String(error?.message || error),
            });
          }
        }
        return webAudioContext;
      };
      sharedAudioContext.prototype = NativeAudioContext.prototype;
      Object.setPrototypeOf(sharedAudioContext, NativeAudioContext);
      window.AudioContext = sharedAudioContext;
      window.webkitAudioContext = sharedAudioContext;
    }
    const config = $GODOT_CONFIG;
    if (webRelease) {
      const runtimeExecutable = releaseAssetUrl('web/releases/' + webRelease.buildId + '/index');
      const originalSizes = config.fileSizes || {};
      config.executable = runtimeExecutable;
      config.mainPack = runtimeExecutable + '.pck';
      config.fileSizes = { ...originalSizes };
      for (const [name, size] of Object.entries(originalSizes)) {
        if (name.startsWith('index.') && name !== 'index.js') {
          config.fileSizes[runtimeExecutable + name.slice('index'.length)] = size;
        }
      }
      document.getElementById('release-description').textContent = 'No download needed.';
    }
    const engine = new Engine(config);
    const start = document.getElementById('start');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const cover = document.getElementById('cover');
    // Godot creates its WebAudio context after the asynchronous pack download.
    // The visible sound control therefore unlocks that actual mixer context,
    // rather than a separate probe context.
    const unlockAudio = async () => {
      if (!webAudioContext) {
        recordAudioDebug('resume-deferred', { reason: 'context-not-created' });
        return false;
      }
      try {
        // Resume synchronously while the browser still associates this work
        // with the player's click/key.
        const resume = webAudioContext.resume();
        await resume;
        if (webAudioContext.state !== 'running') throw new Error('Audio is still suspended');
        recordAudioDebug('context-resumed', { state: webAudioContext.state });
        return true;
      } catch (error) {
        recordAudioDebug('context-resume-failed', { message: String(error?.message || error) });
        return false;
      }
    };
    // The initial pack download can outlive the opening click. Retrying from
    // the first game interaction makes the unlock reliable after that delay,
    // including on browsers that discard the original transient activation.
    for (const eventName of ['pointerdown', 'touchend', 'keydown']) {
      window.addEventListener(eventName, () => {
        void unlockAudio();
        window.pokeaetherBrowserAudio.unlock();
      }, { capture: true, passive: true });
    }
    const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    window.pokeaetherPreview = { state: 'ready' };
    const registration = document.getElementById('registration');
    const registerForm = document.getElementById('registration-form');
    const registerStatus = document.getElementById('register-status');
    const registerSubmit = document.getElementById('register-submit');
    let registrationMeta = null;
    window.pokeaetherOpenRegistration = async () => {
      registration.showModal();
      registerSubmit.disabled = true;
      registerStatus.textContent = 'Checking account registration…';
      try {
        const response = await fetch('/api/auth/web/meta', { cache: 'no-store' });
        if (!response.ok) throw new Error();
        registrationMeta = await response.json();
        registerSubmit.disabled = !registrationMeta.registrationEnabled;
        registerStatus.textContent = registrationMeta.registrationEnabled ? '' : 'Account registration is currently disabled.';
      } catch (_) { registerStatus.textContent = 'Account service unavailable. Please retry later.'; }
    };
    document.getElementById('register-close').onclick = () => { registerForm.reset(); registration.close(); document.getElementById('canvas').focus(); };
    registration.addEventListener('cancel', () => registerForm.reset());
    registerForm.addEventListener('submit', async event => {
      event.preventDefault();
      if (!registrationMeta || registerSubmit.disabled) return;
      const data = new FormData(registerForm);
      if (data.get('password') !== data.get('confirmPassword')) { registerStatus.textContent = 'Passwords do not match.'; return; }
      registerSubmit.disabled = true;
      registerStatus.textContent = 'Creating account…';
      try {
        const response = await fetch('/api/auth/web/signup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: data.get('username'), email: data.get('email'), password: data.get('password'), gender: data.get('gender'),
            locale: 'en', minimumAgeConfirmed: data.has('age'), termsAccepted: data.has('legal'), codeOfConductAccepted: data.has('legal'), privacyPolicyAcknowledged: data.has('legal'),
            termsVersion: registrationMeta.termsVersion, codeOfConductVersion: registrationMeta.codeOfConductVersion, privacyPolicyVersion: registrationMeta.privacyPolicyVersion }),
        });
        const result = await response.json();
        if (!response.ok) {
          const detail = result.detail;
          registerStatus.textContent = typeof detail === 'string' ? detail : detail?.message || 'Registration failed. Check your details and try again.';
        } else {
          registerForm.reset();
          registerStatus.textContent = 'Account created. Check your email and verify your account, then return to login.';
        }
      } catch (_) { registerStatus.textContent = 'Account service unavailable. Please retry later.'; }
      finally { registerSubmit.disabled = false; registerStatus.scrollIntoView({ block: 'nearest' }); }
    });
    if (!local && !webRelease) {
      start.disabled = true;
      status.textContent = 'This development preview must be served on localhost.';
      window.pokeaetherPreview.state = 'blocked';
    }
    start.addEventListener('click', async () => {
      start.disabled = true;
      progress.hidden = false;
      window.pokeaetherPreview.state = 'loading';
      try {
		// This call is deliberately before the first await: it is the user
		// gesture browsers require for Web Audio playback.
		await unlockAudio();
        const missing = Engine.getMissingFeatures({ threads: false });
        if (missing.length) throw new Error('Browser support missing: ' + missing.join(', '));
        await engine.startGame({
          canvas: document.getElementById('canvas'),
          onProgress: (current, total) => {
            if (total > 0) { progress.max = total; progress.value = current; }
            status.textContent = total > 0
              ? `Loading ${Math.round(current / total * 100)}% — ${(current / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`
              : 'Preparing the game…';
          },
          onExit: () => {
            cover.hidden = false;
            status.textContent = 'The preview has closed. Reload this page to start again.';
            window.pokeaetherPreview.state = 'exited';
          }
        });
        // The engine starts asynchronously and may only attach its worklet
        // after the pack has loaded. Resume once more after that attachment.
        await unlockAudio();
        cover.hidden = true;
        document.getElementById('canvas').focus();
        window.pokeaetherPreview.state = 'running';
      } catch (error) {
        status.textContent = 'Could not start the preview. ' + error.message + ' Reload the page to retry.';
        window.pokeaetherPreview.state = 'error';
      }
    });
  </script>
</body>
</html>
