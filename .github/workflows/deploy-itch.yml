name: Deploy Desktop Builds to itch.io

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: Launcher release version. Leave empty to use 0.1.<run number>.
        required: false
        default: ""

concurrency:
  group: deploy-itch
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: stable
  WINDOWS_EXPORT_PRESET: Windows Itch Build
  WINDOWS_EXPORT_PATH: builds/windows/Pokemon Aether Online.exe
  WINDOWS_ITCH_TARGET: afc-adinho/pokemonaetheronline:windows
  LINUX_EXPORT_PRESET: Linux Itch Build
  LINUX_EXPORT_PATH: builds/linux/Pokemon Aether Online.x86_64
  LINUX_ITCH_TARGET: afc-adinho/pokemonaetheronline:linux
  SPRITE_ASSET_CACHE_KEY: pokemon-sprites-basic-v4
  POKEMON_HOME_ASSET_VERSION: pokemon-home-v1
  POKEMON_FRONT_ASSET_VERSION: pokemon-front-v1
  POKEMON_BACK_ASSET_VERSION: pokemon-back-v1
  POKEMON_SHINY_FRONT_ASSET_VERSION: pokemon-shiny-front-v1
  POKEMON_SHINY_BACK_ASSET_VERSION: pokemon-shiny-back-v1
  UPDATE_BASE_URL: https://updates.pokemonaetheronline.com
  MAX_LAUNCHER_GAME_ZIP_BYTES: 1000000000

jobs:
  deploy:
    name: Export and deploy desktop builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set launcher release version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "LAUNCHER_RELEASE_VERSION=${{ github.event.inputs.release_version }}" >> "${GITHUB_ENV}"
          else
            echo "LAUNCHER_RELEASE_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          fi

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y unzip megatools

      - name: Download Godot
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot

      - name: Install Godot export templates
        run: |
          curl -L -o export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q export_templates.tpz -d /tmp/godot-export-templates
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mv /tmp/godot-export-templates/templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Cache Pokemon sprite asset bundle
        id: pokemon-sprite-assets-cache
        uses: actions/cache@v4
        with:
          path: /tmp/pokemon-sprite-assets.zip
          key: ${{ runner.os }}-${{ env.SPRITE_ASSET_CACHE_KEY }}

      - name: Download Pokemon sprite assets
        if: steps.pokemon-sprite-assets-cache.outputs.cache-hit != 'true'
        env:
          SPRITE_ASSET_URLS: ${{ secrets.SPRITE_ASSET_URLS }}
        run: |
          test -n "${SPRITE_ASSET_URLS}"
          mkdir -p /tmp/pokemon-sprite-assets
          for asset_url in ${SPRITE_ASSET_URLS}; do
            if printf '%s' "${asset_url}" | grep -q 'mega.nz'; then
              megadl --path /tmp/pokemon-sprite-assets "${asset_url}"
            else
              file_name="$(basename "${asset_url%%\?*}")"
              curl -L --fail --retry 3 --retry-delay 5 \
                -o "/tmp/pokemon-sprite-assets/${file_name}" \
                "${asset_url}"
            fi
          done
          cat /tmp/pokemon-sprite-assets/pokemon-sprite-assets-basic.zip.part-* > /tmp/pokemon-sprite-assets.zip

      - name: Extract Pokemon sprite assets
        run: |
          unzip -q /tmp/pokemon-sprite-assets.zip -d .

      - name: Cache Godot imported assets
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: ${{ runner.os }}-godot-import-${{ env.GODOT_VERSION }}-${{ env.SPRITE_ASSET_CACHE_KEY }}-${{ hashFiles('project.godot', 'export_presets.cfg') }}

      - name: Import Godot assets
        run: ./godot --headless --import --quit

      - name: Export Windows build
        run: |
          mkdir -p builds/windows
          ./godot --headless --export-release "${WINDOWS_EXPORT_PRESET}" "${WINDOWS_EXPORT_PATH}"

      - name: Export Linux build
        run: |
          mkdir -p builds/linux
          ./godot --headless --export-release "${LINUX_EXPORT_PRESET}" "${LINUX_EXPORT_PATH}"

      - name: Verify Windows build
        run: |
          test -f "builds/windows/Pokemon Aether Online.exe"
          test -f "builds/windows/Pokemon Aether Online.pck"

      - name: Verify Linux build
        run: |
          test -f "builds/linux/Pokemon Aether Online.x86_64"
          test -f "builds/linux/Pokemon Aether Online.pck"

      - name: Package Pokemon sprite asset packs
        run: |
          : > /tmp/asset_pack_args.txt

          package_pack() {
            pack_id="$1"
            pack_version="$2"
            source_path="$3"
            output_path="/tmp/${pack_version}.zip"

            if [ ! -e "${source_path}" ]; then
              echo "::warning ::Skipping ${pack_id}; missing ${source_path}"
              return 0
            fi

            python3 tools/package_asset_pack.py "${output_path}" "${source_path}"
            printf '%s\n' "--asset-pack" "${pack_id}:${pack_version}:${output_path}" >> /tmp/asset_pack_args.txt
          }

          package_pack "pokemon-home" "${POKEMON_HOME_ASSET_VERSION}" assets/sprites/pokemon/pokemon_home
          package_pack "pokemon-front" "${POKEMON_FRONT_ASSET_VERSION}" assets/sprites/pokemon/front
          package_pack "pokemon-back" "${POKEMON_BACK_ASSET_VERSION}" assets/sprites/pokemon/back
          package_pack "pokemon-shiny-front" "${POKEMON_SHINY_FRONT_ASSET_VERSION}" assets/sprites/pokemon/shiny_front
          package_pack "pokemon-shiny-back" "${POKEMON_SHINY_BACK_ASSET_VERSION}" assets/sprites/pokemon/shiny_back

      - name: Package launcher release
        run: |
          python3 tools/package_launcher_release.py \
            --version "${LAUNCHER_RELEASE_VERSION}" \
            --base-url "${UPDATE_BASE_URL}" \
            --game-prefix game \
            --asset-prefix assets \
            --output-dir builds/launcher \
            --default-platform windows \
            $(cat /tmp/asset_pack_args.txt)

      - name: Verify launcher release size
        run: |
          for file in builds/launcher/game-*.zip; do
            size="$(stat -c%s "${file}")"
            echo "${file}: ${size} bytes"
            if [ "${size}" -gt "${MAX_LAUNCHER_GAME_ZIP_BYTES}" ]; then
              echo "::error ::${file} is too large for launcher delivery."
              exit 1
            fi
          done

      - name: Upload launcher release to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_BUCKET}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "Skipping R2 upload because one or more R2 secrets are not configured."
            exit 0
          fi
          python3 tools/upload_launcher_release.py builds/launcher --layout updates

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: |
            builds/windows
            builds/linux

      - name: Upload launcher release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          path: |
            builds/launcher/game-*.zip
            builds/launcher/manifest*.json

      - name: Download butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler

      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_IO_API_KEY }}
        run: |
          test -n "${BUTLER_API_KEY}"
          ./butler push builds/windows "${WINDOWS_ITCH_TARGET}"
          ./butler push builds/linux "${LINUX_ITCH_TARGET}"
