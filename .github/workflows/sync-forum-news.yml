name: Sync Forum News to R2

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-forum-news.yml"
      - "tools/build_forum_news_feed.py"
      - "tools/test_build_forum_news_feed.py"
      - "tools/upload_launcher_release.py"
      - "tools/test_upload_launcher_release.py"

permissions:
  contents: read

concurrency:
  group: sync-forum-news-r2
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEWS_PUBLIC_URL: https://updates.pokeaether.com/data/news.json

jobs:
  sync:
    name: Build, validate, and publish forum news
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test news generation and R2 upload contracts
        run: |
          python3 tools/test_build_forum_news_feed.py
          python3 tools/test_upload_launcher_release.py

      - name: Generate news from Official Announcements
        run: python3 tools/build_forum_news_feed.py --output builds/news/news.json

      - name: Preserve and compare the current public feed
        id: compare
        run: |
          set -Eeuo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --header "Cache-Control: no-cache" \
            "${NEWS_PUBLIC_URL}?preflight=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output builds/news/news.previous.json
          python3 tools/build_forum_news_feed.py \
            --validate-feed builds/news/news.previous.json

          if cmp --silent builds/news/news.json builds/news/news.previous.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The public news feed already matches the forum."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "The forum produced a new validated news feed."
          fi

      - name: Publish rollback copy to R2
        if: steps.compare.outputs.changed == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 tools/upload_launcher_release.py builds/news \
            --prefix data \
            --file news.previous.json

      - name: Publish forum news to R2
        if: steps.compare.outputs.changed == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 tools/upload_launcher_release.py builds/news \
            --prefix data \
            --file news.json

      - name: Verify the public feed
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          expected_sha256="$(sha256sum builds/news/news.json | cut -d ' ' -f 1)"

          for attempt in 1 2 3 4 5; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --header "Cache-Control: no-cache" \
              "${NEWS_PUBLIC_URL}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              --output builds/news/news.published.json; then
              published_sha256="$(sha256sum builds/news/news.published.json | cut -d ' ' -f 1)"
              if [ "${published_sha256}" = "${expected_sha256}" ]; then
                python3 tools/build_forum_news_feed.py \
                  --validate-feed builds/news/news.published.json
                echo "Verified the published forum news feed."
                exit 0
              fi
            fi
            sleep $((attempt * 2))
          done

          echo "::error::The public news feed did not match the validated upload."
          exit 1
