name: Deploy Desktop Builds to R2

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: Launcher release version. Leave empty to use 0.1.<run number>.
        required: false
        default: ""
      build_launcher:
        description: Force rebuilding and uploading launcher downloads.
        required: false
        default: "false"

concurrency:
  group: deploy-desktop-r2
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: stable
  WINDOWS_EXPORT_PRESET: Windows Itch Build
  WINDOWS_EXPORT_PATH: builds/windows/PokeAether.exe
  WINDOWS_LAUNCHER_EXPORT_PRESET: Windows Launcher
  WINDOWS_LAUNCHER_EXPORT_PATH: builds/launcher-app/windows/PokeAether Launcher.exe
  LINUX_EXPORT_PRESET: Linux Itch Build
  LINUX_EXPORT_PATH: builds/linux/PokeAether.x86_64
  LINUX_LAUNCHER_EXPORT_PRESET: Linux Launcher
  LINUX_LAUNCHER_EXPORT_PATH: builds/launcher-app/linux/PokeAether Launcher.x86_64
  MACOS_EXPORT_PRESET: macOS Itch Build
  MACOS_EXPORT_PATH: builds/macos/PokeAether.app
  MACOS_LAUNCHER_EXPORT_PRESET: macOS Launcher
  MACOS_LAUNCHER_EXPORT_PATH: builds/launcher-app/macos/PokeAether Launcher.app
  POKEMON_HOME_ASSET_VERSION_PREFIX: pokemon-home
  POKEMON_FRONT_ASSET_VERSION_PREFIX: pokemon-front-scale1-128
  POKEMON_BACK_ASSET_VERSION_PREFIX: pokemon-back-scale1-128
  POKEMON_SHINY_FRONT_ASSET_VERSION_PREFIX: pokemon-shiny-front-scale1-128
  POKEMON_SHINY_BACK_ASSET_VERSION_PREFIX: pokemon-shiny-back-scale1-128
  POKEMON_GEN5_FRONT_ASSET_VERSION_PREFIX: pokemon-gen5-front
  POKEMON_GEN5_BACK_ASSET_VERSION_PREFIX: pokemon-gen5-back
  POKEMON_GEN5_SHINY_FRONT_ASSET_VERSION_PREFIX: pokemon-gen5-shiny-front
  POKEMON_GEN5_SHINY_BACK_ASSET_VERSION_PREFIX: pokemon-gen5-shiny-back
  MUSIC_ASSET_VERSION_PREFIX: music
  UPDATE_BASE_URL: https://updates.pokeaether.com
  MAX_LAUNCHER_GAME_ZIP_BYTES: 1000000000

jobs:
  deploy:
    name: Export and upload desktop builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set launcher release version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "LAUNCHER_RELEASE_VERSION=${{ github.event.inputs.release_version }}" >> "${GITHUB_ENV}"
          else
            echo "LAUNCHER_RELEASE_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          fi

      - name: Detect launcher changes
        run: |
          build_launcher=false

          if [ "${{ github.event.inputs.build_launcher }}" = "true" ]; then
            build_launcher=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git diff --name-only HEAD~1 HEAD)"
            else
              changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            fi

            if printf '%s\n' "${changed_files}" | grep -E '^(launcher/|tools/package_launcher_release\.py|tools/upload_launcher_release\.py|\.github/workflows/deploy-desktop-r2\.yml$)' >/dev/null; then
              build_launcher=true
            fi
          fi

          echo "BUILD_LAUNCHER=${build_launcher}" >> "${GITHUB_ENV}"
          echo "Build launcher: ${build_launcher}"

      - name: Stamp launcher version
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          python3 tools/stamp_godot_version.py \
            --project launcher/project.godot \
            --export-presets launcher/export_presets.cfg \
            --version "${LAUNCHER_RELEASE_VERSION}"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot

      - name: Install Godot export templates
        run: |
          curl -L -o export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q export_templates.tpz -d /tmp/godot-export-templates
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mv /tmp/godot-export-templates/templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          python3 - <<'PY'
          import os
          import shutil
          import zipfile

          templates_dir = os.path.expanduser(
              os.path.join(
                  "~",
                  ".local/share/godot/export_templates",
                  os.environ["GODOT_VERSION"] + "." + os.environ["GODOT_RELEASE"],
              )
          )
          macos_zip = os.path.join(templates_dir, "macos.zip")
          repack_dir = "/tmp/godot-macos-template-repack"
          shutil.rmtree(repack_dir, ignore_errors=True)
          os.makedirs(repack_dir, exist_ok=True)
          with zipfile.ZipFile(macos_zip, "r") as archive:
              archive.extractall(repack_dir)
          with zipfile.ZipFile(macos_zip, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for base, dirs, files in os.walk(repack_dir):
                  dirs.sort()
                  files.sort()
                  rel_dir = os.path.relpath(base, repack_dir)
                  if rel_dir != ".":
                      archive.write(base, rel_dir.rstrip("/") + "/")
                  for file_name in files:
                      path = os.path.join(base, file_name)
                      rel_path = os.path.relpath(path, repack_dir)
                      info = zipfile.ZipInfo.from_file(path, rel_path)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      if file_name.startswith("godot_macos_"):
                          info.external_attr = (0o100755 & 0xFFFF) << 16
                      with open(path, "rb") as file:
                          archive.writestr(info, file.read())
          PY

      - name: Cache Godot imported assets
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: ${{ runner.os }}-godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'export_presets.cfg', 'assets/followers/**/*.png', 'assets/followers_shiny/**/*.png', 'assets/player/male/body/**/*.png', 'assets/player/female/body/**/*.png') }}

      - name: Import Godot assets
        run: ./godot --headless --import --quit

      - name: Import launcher assets
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          cd launcher
          ../godot --headless --import --quit

      - name: Export Windows build
        run: |
          mkdir -p builds/windows
          ./godot --headless --export-release "${WINDOWS_EXPORT_PRESET}" "${WINDOWS_EXPORT_PATH}"

      - name: Export Linux build
        run: |
          mkdir -p builds/linux
          ./godot --headless --export-release "${LINUX_EXPORT_PRESET}" "${LINUX_EXPORT_PATH}"

      - name: Export macOS build
        run: |
          mkdir -p builds/macos
          ./godot --headless --export-release "${MACOS_EXPORT_PRESET}" "${MACOS_EXPORT_PATH}"

      - name: Verify Windows build
        run: |
          test -f "builds/windows/PokeAether.exe"
          test -f "builds/windows/PokeAether.pck"
          grep -a -q "assets/followers/CHARIZARD.png" "builds/windows/PokeAether.pck"
          grep -a -q "assets/followers_shiny/CHARIZARD.png" "builds/windows/PokeAether.pck"
          git ls-files 'assets/player/male/body/**/*.png' 'assets/player/female/body/**/*.png' | while read -r asset_path; do
            grep -a -q "$asset_path" "builds/windows/PokeAether.pck"
          done
          grep -a -q "assets/player/male/body/body_manifest.json" "builds/windows/PokeAether.pck"
          grep -a -q "assets/player/female/body/body_manifest.json" "builds/windows/PokeAether.pck"

      - name: Verify Linux build
        run: |
          test -f "builds/linux/PokeAether.x86_64"
          test -f "builds/linux/PokeAether.pck"
          grep -a -q "assets/followers/CHARIZARD.png" "builds/linux/PokeAether.pck"
          grep -a -q "assets/followers_shiny/CHARIZARD.png" "builds/linux/PokeAether.pck"
          git ls-files 'assets/player/male/body/**/*.png' 'assets/player/female/body/**/*.png' | while read -r asset_path; do
            grep -a -q "$asset_path" "builds/linux/PokeAether.pck"
          done
          grep -a -q "assets/player/male/body/body_manifest.json" "builds/linux/PokeAether.pck"
          grep -a -q "assets/player/female/body/body_manifest.json" "builds/linux/PokeAether.pck"

      - name: Verify macOS build
        run: |
          test -d "builds/macos/PokeAether.app"
          test -f "builds/macos/PokeAether.app/Contents/MacOS/PokeAether"
          if [ ! -f "builds/macos/PokeAether.pck" ] && [ ! -f "builds/macos/PokeAether.app/Contents/Resources/PokeAether.pck" ]; then
            echo "::error::MacOS build missing expected PokeAether.pck"
            exit 1
          fi
          if [ -f "builds/macos/PokeAether.pck" ]; then
            macos_pck="builds/macos/PokeAether.pck"
          else
            macos_pck="builds/macos/PokeAether.app/Contents/Resources/PokeAether.pck"
          fi
          git ls-files 'assets/player/male/body/**/*.png' 'assets/player/female/body/**/*.png' | while read -r asset_path; do
            grep -a -q "$asset_path" "$macos_pck"
          done
          grep -a -q "assets/player/male/body/body_manifest.json" "$macos_pck"
          grep -a -q "assets/player/female/body/body_manifest.json" "$macos_pck"

      - name: Export macOS launcher
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          mkdir -p builds/launcher-app/macos
          cd launcher
          ../godot --headless --export-release "${MACOS_LAUNCHER_EXPORT_PRESET}" "../${MACOS_LAUNCHER_EXPORT_PATH}"

      - name: Export Windows launcher
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          mkdir -p builds/launcher-app/windows
          cd launcher
          ../godot --headless --export-release "${WINDOWS_LAUNCHER_EXPORT_PRESET}" "../${WINDOWS_LAUNCHER_EXPORT_PATH}"

      - name: Export Linux launcher
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          mkdir -p builds/launcher-app/linux
          cd launcher
          ../godot --headless --export-release "${LINUX_LAUNCHER_EXPORT_PRESET}" "../${LINUX_LAUNCHER_EXPORT_PATH}"

      - name: Package Pokemon sprite asset packs
        run: |
          : > /tmp/asset_pack_args.txt

          package_local_pack() {
            pack_id="$1"
            pack_version_prefix="$2"
            source_path="$3"
            optional="${4:-false}"
            pack_hash="$(find "${source_path}" -type f ! -name '*.import' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)"
            pack_version="${pack_version_prefix}-${pack_hash}"
            zip_path="builds/asset-packs/${pack_version}.zip"
            python3 tools/package_asset_pack.py "${zip_path}" "${source_path}"
            asset_pack_arg="${pack_id}:${pack_version}:${zip_path}"
            if [ "${optional}" = "true" ]; then
              asset_pack_arg="${asset_pack_arg}:true"
            fi
            printf '%s\n' "--asset-pack" "${asset_pack_arg}" >> /tmp/asset_pack_args.txt
          }

          package_local_pack "pokemon-home" "${POKEMON_HOME_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/pokemon_home"
          package_local_pack "pokemon-front" "${POKEMON_FRONT_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/front"
          package_local_pack "pokemon-back" "${POKEMON_BACK_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/back"
          package_local_pack "pokemon-shiny-front" "${POKEMON_SHINY_FRONT_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/shiny_front"
          package_local_pack "pokemon-shiny-back" "${POKEMON_SHINY_BACK_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/shiny_back"
          package_local_pack "pokemon-gen5-front" "${POKEMON_GEN5_FRONT_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/gen5/front" "true"
          package_local_pack "pokemon-gen5-back" "${POKEMON_GEN5_BACK_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/gen5/back" "true"
          package_local_pack "pokemon-gen5-shiny-front" "${POKEMON_GEN5_SHINY_FRONT_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/gen5/shiny_front" "true"
          package_local_pack "pokemon-gen5-shiny-back" "${POKEMON_GEN5_SHINY_BACK_ASSET_VERSION_PREFIX}" "assets/sprites/pokemon/gen5/shiny_back" "true"

      - name: Package music asset pack
        run: |
          mkdir -p builds/music
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import os

          source_dir = Path("assets/music")
          hash_input = []
          for path in sorted(source_dir.rglob("*")):
              if path.is_file() and path.suffix != ".import":
                  hash_input.append(path.relative_to(source_dir).as_posix().encode("utf-8"))
                  hash_input.append(path.read_bytes())
          import hashlib
          digest = hashlib.sha256()
          for value in hash_input:
              digest.update(value)
          version = f"{os.environ['MUSIC_ASSET_VERSION_PREFIX']}-{digest.hexdigest()[:12]}"
          zip_path = Path("builds/music") / f"{version}.zip"
          if zip_path.exists():
              zip_path.unlink()

          with ZipFile(zip_path, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source_dir.rglob("*")):
                  if not path.is_file() or path.suffix == ".import":
                      continue
                  archive_path = path.as_posix()
                  info = ZipInfo(archive_path)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, path.read_bytes())
          print(f"Wrote {zip_path} ({zip_path.stat().st_size} bytes)")
          with Path("/tmp/asset_pack_args.txt").open("a", encoding="utf-8") as args_file:
              args_file.write("--asset-pack\n")
              args_file.write(f"music:{version}:{zip_path.as_posix()}\n")
          PY

      - name: Package launcher release
        run: |
          launcher_args=()
          if [ "${BUILD_LAUNCHER}" = "true" ]; then
            launcher_args+=(--include-launcher)
          fi

          python3 tools/package_launcher_release.py \
            --version "${LAUNCHER_RELEASE_VERSION}" \
            --base-url "${UPDATE_BASE_URL}" \
            --game-prefix game \
            --asset-prefix assets \
            --output-dir builds/launcher \
            --default-platform windows \
            "${launcher_args[@]}" \
            $(cat /tmp/asset_pack_args.txt)

          ls -lah builds/launcher
          if [ "${BUILD_LAUNCHER}" = "true" ]; then
            test -f builds/launcher/PokeAetherLauncher-windows.zip
            test -f builds/launcher/PokeAetherLauncher-linux.zip
            test -f builds/launcher/PokeAetherLauncher-macos.zip
          fi

      - name: Verify launcher release size
        run: |
          for file in builds/launcher/game-*.zip; do
            size="$(stat -c%s "${file}")"
            echo "${file}: ${size} bytes"
            if [ "${size}" -gt "${MAX_LAUNCHER_GAME_ZIP_BYTES}" ]; then
              echo "::error ::${file} is too large for launcher delivery."
              exit 1
            fi
          done

      - name: Upload launcher release to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_BUCKET}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "Skipping R2 upload because one or more R2 secrets are not configured."
            exit 0
          fi
          python3 tools/upload_launcher_release.py builds/launcher --layout updates
          cp "builds/launcher/game-${LAUNCHER_RELEASE_VERSION}-windows.zip" builds/launcher/PokeAether-windows.zip
          cp "builds/launcher/game-${LAUNCHER_RELEASE_VERSION}-linux.zip" builds/launcher/PokeAether-linux.zip
          cp "builds/launcher/game-${LAUNCHER_RELEASE_VERSION}-macos.zip" builds/launcher/PokeAether-macos.zip
          python3 tools/upload_launcher_release.py builds/launcher \
            --prefix "game/latest" \
            --file PokeAether-windows.zip \
            --file PokeAether-linux.zip \
            --file PokeAether-macos.zip
          if [ "${BUILD_LAUNCHER}" = "true" ]; then
            python3 tools/upload_launcher_release.py builds/launcher \
              --prefix "launcher/${LAUNCHER_RELEASE_VERSION}" \
              --file PokeAetherLauncher-windows.zip \
              --file PokeAetherLauncher-linux.zip \
              --file PokeAetherLauncher-macos.zip
          else
            echo "Skipping launcher download upload because BUILD_LAUNCHER=false."
          fi

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: |
            builds/windows
            builds/linux
            builds/macos

      - name: Upload launcher release artifacts
        if: env.BUILD_LAUNCHER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          path: |
            builds/launcher/game-*.zip
            builds/launcher/manifest*.json
            builds/launcher/PokeAetherLauncher-*.zip
