name: Deploy Desktop Builds to R2

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional display version. Defaults automatically to 0.0.<workflow run number>.
        required: false
        type: string
        default: ""
      build_launcher:
        description: Rebuild and publish the launcher only when the launcher itself changed.
        required: false
        type: boolean
        default: false
      build_macos:
        description: Build and include macOS artifacts.
        required: false
        type: boolean
        default: false
      announce_discord:
        description: Post a Discord release announcement after a successful R2 upload.
        required: false
        type: boolean
        default: false
      release_notes:
        description: Optional release notes for the Discord announcement.
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-desktop-r2
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: stable
  WINDOWS_EXPORT_PRESET: Windows Itch Build
  WINDOWS_EXPORT_PATH: builds/windows/PokeAether.exe
  WINDOWS_LAUNCHER_EXPORT_PRESET: Windows Launcher
  WINDOWS_LAUNCHER_EXPORT_PATH: builds/launcher-app/windows/PokeAether Launcher.exe
  LINUX_EXPORT_PRESET: Linux Itch Build
  LINUX_EXPORT_PATH: builds/linux/PokeAether.x86_64
  LINUX_LAUNCHER_EXPORT_PRESET: Linux Launcher
  LINUX_LAUNCHER_EXPORT_PATH: builds/launcher-app/linux/PokeAether Launcher.x86_64
  MACOS_EXPORT_PRESET: macOS Itch Build
  MACOS_EXPORT_PATH: builds/macos/PokeAether.app
  MACOS_LAUNCHER_EXPORT_PRESET: macOS Launcher
  MACOS_LAUNCHER_EXPORT_PATH: builds/launcher-app/macos/PokeAether Launcher.app
  POKEMON_HOME_ASSET_VERSION: pokemon-home-f2c6fa7b95a7

  POKEMON_HOME_SHINY_ASSET_VERSION: pokemon-home-shiny-dac02a2f4694
  POKEMON_FRONT_ASSET_VERSION: pokemon-front-scale1-128-2a3a4fbda143
  POKEMON_BACK_ASSET_VERSION: pokemon-back-scale1-128-f3ae81ef1738
  POKEMON_SHINY_FRONT_ASSET_VERSION: pokemon-shiny-front-scale1-128-f944f936f88d
  POKEMON_SHINY_BACK_ASSET_VERSION: pokemon-shiny-back-scale1-128-d3efb1e01674
  POKEMON_GEN5_FRONT_ASSET_VERSION: pokemon-gen5-front-14ff66f7c2b7
  POKEMON_GEN5_BACK_ASSET_VERSION: pokemon-gen5-back-6f374c1fb42b
  POKEMON_GEN5_SHINY_FRONT_ASSET_VERSION: pokemon-gen5-shiny-front-b999587c7d07
  POKEMON_GEN5_SHINY_BACK_ASSET_VERSION: pokemon-gen5-shiny-back-dbfa78b78986
  POKEMON_HOME_ASSET_SIZE: 60806092

  POKEMON_HOME_SHINY_ASSET_SIZE: 33131877
  POKEMON_FRONT_ASSET_SIZE: 97005176
  POKEMON_BACK_ASSET_SIZE: 78796293
  POKEMON_SHINY_FRONT_ASSET_SIZE: 94346548
  POKEMON_SHINY_BACK_ASSET_SIZE: 72823470
  POKEMON_GEN5_FRONT_ASSET_SIZE: 314551982
  POKEMON_GEN5_BACK_ASSET_SIZE: 248412184
  POKEMON_GEN5_SHINY_FRONT_ASSET_SIZE: 317541005
  POKEMON_GEN5_SHINY_BACK_ASSET_SIZE: 251502026
  MUSIC_ASSET_VERSION: music-fd6cc7b17d61
  MUSIC_ASSET_SIZE: 29709745
  UPDATE_BASE_URL: https://updates.pokeaether.com
  MAX_LAUNCHER_GAME_ZIP_BYTES: 1000000000

jobs:
  deploy:
    name: Export and upload desktop builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set automatic release identity
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          release_version="${INPUT_RELEASE_VERSION:-0.0.${GITHUB_RUN_NUMBER}}"
          if ! printf '%s' "${release_version}" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}([-+][A-Za-z0-9._-]+)?$'; then
            echo "::error::release_version must look like 0.2.0 or 0.2.0-beta.1."
            exit 1
          fi
          echo "LAUNCHER_RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          client_build_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CLIENT_BUILD_ID=${client_build_id}" >> "${GITHUB_ENV}"
          echo "Release version: ${release_version}"
          echo "Client build: ${client_build_id}"

      - name: Detect launcher changes
        env:
          INPUT_BUILD_LAUNCHER: ${{ inputs.build_launcher }}
        run: |
          build_launcher=false

          if [ "${INPUT_BUILD_LAUNCHER}" = "true" ]; then
            build_launcher=true
          fi

          echo "BUILD_LAUNCHER=${build_launcher}" >> "${GITHUB_ENV}"
          echo "Build launcher: ${build_launcher}"

      - name: Detect build platform
        env:
          INPUT_BUILD_MACOS: ${{ inputs.build_macos }}
        run: |
          build_macos=false
          package_platforms="windows,linux"

          if [ "${INPUT_BUILD_MACOS}" = "true" ]; then
            build_macos=true
            package_platforms="windows,linux,macos"
          fi

          echo "BUILD_MACOS=${build_macos}" >> "${GITHUB_ENV}"
          echo "PACKAGE_PLATFORMS=${package_platforms}" >> "${GITHUB_ENV}"

          echo "Build macOS: ${build_macos}"
          echo "Package platforms: ${package_platforms}"

      - name: Stamp launcher version
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          python3 tools/stamp_godot_version.py \
            --project launcher/project.godot \
            --export-presets launcher/export_presets.cfg \
            --version "${LAUNCHER_RELEASE_VERSION}"

      - name: Stamp game release and build identity
        run: |
          python3 tools/stamp_godot_version.py \
            --project project.godot \
            --export-presets export_presets.cfg \
            --version "${LAUNCHER_RELEASE_VERSION}" \
            --build-id "${CLIENT_BUILD_ID}"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot

      - name: Install Godot export templates
        run: |
          curl -L -o export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q export_templates.tpz -d /tmp/godot-export-templates
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mv /tmp/godot-export-templates/templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          python3 - <<'PY'
          import os
          import shutil
          import zipfile

          templates_dir = os.path.expanduser(
              os.path.join(
                  "~",
                  ".local/share/godot/export_templates",
                  os.environ["GODOT_VERSION"] + "." + os.environ["GODOT_RELEASE"],
              )
          )
          macos_zip = os.path.join(templates_dir, "macos.zip")
          repack_dir = "/tmp/godot-macos-template-repack"
          shutil.rmtree(repack_dir, ignore_errors=True)
          os.makedirs(repack_dir, exist_ok=True)
          with zipfile.ZipFile(macos_zip, "r") as archive:
              archive.extractall(repack_dir)
          with zipfile.ZipFile(macos_zip, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for base, dirs, files in os.walk(repack_dir):
                  dirs.sort()
                  files.sort()
                  rel_dir = os.path.relpath(base, repack_dir)
                  if rel_dir != ".":
                      archive.write(base, rel_dir.rstrip("/") + "/")
                  for file_name in files:
                      path = os.path.join(base, file_name)
                      rel_path = os.path.relpath(path, repack_dir)
                      info = zipfile.ZipInfo.from_file(path, rel_path)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      if file_name.startswith("godot_macos_"):
                          info.external_attr = (0o100755 & 0xFFFF) << 16
                      with open(path, "rb") as file:
                          archive.writestr(info, file.read())
          PY

      - name: Cache Godot imported assets
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: ${{ runner.os }}-godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'export_presets.cfg', 'assets/followers/**/*.png', 'assets/followers_shiny/**/*.png', 'assets/player/male/body/**/*.png', 'assets/player/female/body/**/*.png') }}

      - name: Import Godot assets
        run: ./godot --headless --import --quit

      - name: Verify generated world access catalog
        run: ./godot --no-header --headless --path . res://tools/generate_world_access_catalog.tscn -- --check

      - name: Import launcher assets
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          cd launcher
          ../godot --headless --import --quit

      - name: Export Windows build
        run: |
          mkdir -p builds/windows
          ./godot --headless --export-release "${WINDOWS_EXPORT_PRESET}" "${WINDOWS_EXPORT_PATH}"

      - name: Export Linux build
        run: |
          mkdir -p builds/linux
          ./godot --headless --export-release "${LINUX_EXPORT_PRESET}" "${LINUX_EXPORT_PATH}"

      - name: Export macOS build
        if: env.BUILD_MACOS == 'true'
        run: |
          mkdir -p builds/macos
          ./godot --headless --export-release "${MACOS_EXPORT_PRESET}" "${MACOS_EXPORT_PATH}"

      - name: Verify Windows build
        run: |
          test -f "builds/windows/PokeAether.exe"
          test -f "builds/windows/PokeAether.pck"
          grep -a -q "assets/followers/CHARIZARD.png" "builds/windows/PokeAether.pck"
          grep -a -q "assets/followers_shiny/CHARIZARD.png" "builds/windows/PokeAether.pck"
          git ls-files 'assets/player/male/body/**/*.png' 'assets/player/female/body/**/*.png' | while read -r asset_path; do
            grep -a -q "$asset_path" "builds/windows/PokeAether.pck"
          done
          grep -a -q "assets/player/male/body/body_manifest.json" "builds/windows/PokeAether.pck"
          grep -a -q "assets/player/female/body/body_manifest.json" "builds/windows/PokeAether.pck"

      - name: Verify Linux build
        run: |
          test -f "builds/linux/PokeAether.x86_64"
          test -f "builds/linux/PokeAether.pck"
          grep -a -q "assets/followers/CHARIZARD.png" "builds/linux/PokeAether.pck"
          grep -a -q "assets/followers_shiny/CHARIZARD.png" "builds/linux/PokeAether.pck"
          git ls-files 'assets/player/male/body/**/*.png' 'assets/player/female/body/**/*.png' | while read -r asset_path; do
            grep -a -q "$asset_path" "builds/linux/PokeAether.pck"
          done
          grep -a -q "assets/player/male/body/body_manifest.json" "builds/linux/PokeAether.pck"
          grep -a -q "assets/player/female/body/body_manifest.json" "builds/linux/PokeAether.pck"

      - name: Verify macOS build
        if: env.BUILD_MACOS == 'true'
        run: |
          test -d "builds/macos/PokeAether.app"
          test -f "builds/macos/PokeAether.app/Contents/MacOS/PokeAether"
          if [ ! -f "builds/macos/PokeAether.pck" ] && [ ! -f "builds/macos/PokeAether.app/Contents/Resources/PokeAether.pck" ]; then
            echo "::error::MacOS build missing expected PokeAether.pck"
            exit 1
          fi
          if [ -f "builds/macos/PokeAether.pck" ]; then
            macos_pck="builds/macos/PokeAether.pck"
          else
            macos_pck="builds/macos/PokeAether.app/Contents/Resources/PokeAether.pck"
          fi
          git ls-files 'assets/player/male/body/**/*.png' 'assets/player/female/body/**/*.png' | while read -r asset_path; do
            grep -a -q "$asset_path" "$macos_pck"
          done
          grep -a -q "assets/player/male/body/body_manifest.json" "$macos_pck"
          grep -a -q "assets/player/female/body/body_manifest.json" "$macos_pck"

      - name: Export macOS launcher
        if: ${{ env.BUILD_LAUNCHER == 'true' && env.BUILD_MACOS == 'true' }}
        run: |
          mkdir -p builds/launcher-app/macos
          cd launcher
          ../godot --headless --export-release "${MACOS_LAUNCHER_EXPORT_PRESET}" "../${MACOS_LAUNCHER_EXPORT_PATH}"

      - name: Export Windows launcher
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          mkdir -p builds/launcher-app/windows
          cd launcher
          ../godot --headless --export-release "${WINDOWS_LAUNCHER_EXPORT_PRESET}" "../${WINDOWS_LAUNCHER_EXPORT_PATH}"

      - name: Export Linux launcher
        if: env.BUILD_LAUNCHER == 'true'
        run: |
          mkdir -p builds/launcher-app/linux
          cd launcher
          ../godot --headless --export-release "${LINUX_LAUNCHER_EXPORT_PRESET}" "../${LINUX_LAUNCHER_EXPORT_PATH}"

      - name: Register Pokemon sprite asset packs
        run: |
          : > /tmp/asset_pack_args.txt

          register_external_pack() {
            pack_id="$1"
            pack_version="$2"
            size_bytes="$3"
            optional="${4:-false}"

            if [ -z "${pack_id}" ] || [ -z "${pack_version}" ]; then
              echo "Missing external asset pack id or version." >&2
              return 1
            fi

            asset_url="${UPDATE_BASE_URL}/assets/${pack_version}.zip"
            echo "Verifying external asset pack ${pack_id}: ${asset_url}"
            curl -fsSI "${asset_url}" >/dev/null

            asset_pack_arg="${pack_id}:${pack_version}:${pack_version}.zip:${size_bytes}"
            if [ "${optional}" = "true" ]; then
              asset_pack_arg="${asset_pack_arg}:true"
            fi
            printf '%s\n' "--external-asset-pack" "${asset_pack_arg}" >> /tmp/asset_pack_args.txt
          }

          register_external_pack "pokemon-home" "${POKEMON_HOME_ASSET_VERSION}" "${POKEMON_HOME_ASSET_SIZE}"
          register_external_pack "pokemon-home-shiny" "${POKEMON_HOME_SHINY_ASSET_VERSION}" "${POKEMON_HOME_SHINY_ASSET_SIZE}"
          register_external_pack "pokemon-front" "${POKEMON_FRONT_ASSET_VERSION}" "${POKEMON_FRONT_ASSET_SIZE}"
          register_external_pack "pokemon-back" "${POKEMON_BACK_ASSET_VERSION}" "${POKEMON_BACK_ASSET_SIZE}"
          register_external_pack "pokemon-shiny-front" "${POKEMON_SHINY_FRONT_ASSET_VERSION}" "${POKEMON_SHINY_FRONT_ASSET_SIZE}"
          register_external_pack "pokemon-shiny-back" "${POKEMON_SHINY_BACK_ASSET_VERSION}" "${POKEMON_SHINY_BACK_ASSET_SIZE}"
          register_external_pack "pokemon-gen5-front" "${POKEMON_GEN5_FRONT_ASSET_VERSION}" "${POKEMON_GEN5_FRONT_ASSET_SIZE}" "true"
          register_external_pack "pokemon-gen5-back" "${POKEMON_GEN5_BACK_ASSET_VERSION}" "${POKEMON_GEN5_BACK_ASSET_SIZE}" "true"
          register_external_pack "pokemon-gen5-shiny-front" "${POKEMON_GEN5_SHINY_FRONT_ASSET_VERSION}" "${POKEMON_GEN5_SHINY_FRONT_ASSET_SIZE}" "true"
          register_external_pack "pokemon-gen5-shiny-back" "${POKEMON_GEN5_SHINY_BACK_ASSET_VERSION}" "${POKEMON_GEN5_SHINY_BACK_ASSET_SIZE}" "true"
          register_external_pack "music" "${MUSIC_ASSET_VERSION}" "${MUSIC_ASSET_SIZE}"

      - name: Package launcher release
        run: |
          launcher_args=()
          if [ "${BUILD_LAUNCHER}" = "true" ]; then
            launcher_args+=(--include-launcher)
          fi

          python3 tools/package_launcher_release.py \
            --version "${LAUNCHER_RELEASE_VERSION}" \
            --build-id "${CLIENT_BUILD_ID}" \
            --base-url "${UPDATE_BASE_URL}" \
            --game-prefix game \
            --asset-prefix assets \
            --launcher-prefix "launcher/${LAUNCHER_RELEASE_VERSION}-${CLIENT_BUILD_ID}" \
            --output-dir builds/launcher \
            --default-platform windows \
            --platform "${PACKAGE_PLATFORMS}" \
            "${launcher_args[@]}" \
            $(cat /tmp/asset_pack_args.txt)

          ls -lah builds/launcher
          if [ "${BUILD_LAUNCHER}" = "true" ]; then
            test -f builds/launcher/PokeAetherLauncher-windows.zip
            test -f builds/launcher/PokeAetherLauncher-linux.zip
            if [ "${BUILD_MACOS}" = "true" ]; then
              test -f builds/launcher/PokeAetherLauncher-macos.zip
            fi
          fi

      - name: Preserve launcher metadata for game-only releases
        if: env.BUILD_LAUNCHER != 'true'
        run: |
          mkdir -p /tmp/current-launcher-manifests
          manifest_names=(manifest.json manifest-windows.json manifest-linux.json)
          if [ "${BUILD_MACOS}" = "true" ]; then
            manifest_names+=(manifest-macos.json)
          fi
          for manifest_name in "${manifest_names[@]}"; do
            curl --fail --silent --show-error \
              "${UPDATE_BASE_URL}/${manifest_name}" \
              --output "/tmp/current-launcher-manifests/${manifest_name}"
          done

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path("builds/launcher")
          current_dir = Path("/tmp/current-launcher-manifests")
          required = {"version", "url", "sha256", "sizeBytes", "binary"}

          for manifest_path in sorted(output_dir.glob("manifest*.json")):
              current_path = current_dir / manifest_path.name
              if not current_path.is_file():
                  raise SystemExit(f"missing current launcher manifest: {current_path}")

              generated = json.loads(manifest_path.read_text(encoding="utf-8"))
              current = json.loads(current_path.read_text(encoding="utf-8"))
              launcher = current.get("launcher")
              if not isinstance(launcher, dict) or not required.issubset(launcher):
                  raise SystemExit(f"{current_path} has no complete launcher update metadata")
              if any(launcher.get(field) in (None, "", 0) for field in required):
                  raise SystemExit(f"{current_path} has empty launcher update metadata")

              generated["launcher"] = launcher
              manifest_path.write_text(
                  json.dumps(generated, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(f"Preserved launcher {launcher['version']} in {manifest_path}")
          PY

      - name: Verify launcher manifests include required asset packs
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required_ids = {
              "pokemon-home",
              "pokemon-front",
              "pokemon-back",
              "pokemon-shiny-front",
              "pokemon-shiny-back",
              "music",
          }
          optional_gen5_ids = {
              "pokemon-gen5-front",
              "pokemon-gen5-back",
              "pokemon-gen5-shiny-front",
              "pokemon-gen5-shiny-back",
          }
          required_launcher_fields = {"version", "url", "sha256", "sizeBytes", "binary"}

          for manifest_path in sorted(Path("builds/launcher").glob("manifest*.json")):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              game = manifest.get("game")
              if not isinstance(game, dict) or game.get("buildId") != os.environ["CLIENT_BUILD_ID"]:
                  raise SystemExit(f"{manifest_path} missing the current immutable client build ID")
              launcher = manifest.get("launcher")
              if not isinstance(launcher, dict) or not required_launcher_fields.issubset(launcher):
                  raise SystemExit(f"{manifest_path} missing launcher self-update metadata")
              if any(launcher.get(field) in (None, "", 0) for field in required_launcher_fields):
                  raise SystemExit(f"{manifest_path} has incomplete launcher self-update metadata")
              packs = manifest.get("assetPacks", [])
              by_id = {
                  pack.get("id"): pack
                  for pack in packs
                  if isinstance(pack, dict) and pack.get("id")
              }

              missing = sorted(required_ids - by_id.keys())
              if missing:
                  raise SystemExit(f"{manifest_path} missing required asset packs: {', '.join(missing)}")

              for pack_id in sorted(required_ids):
                  pack = by_id[pack_id]
                  if not pack.get("version") or not pack.get("url"):
                      raise SystemExit(f"{manifest_path} has incomplete asset pack: {pack_id}")
                  if pack_id != "music" and not str(pack["url"]).endswith(f"/{pack['version']}.zip"):
                      raise SystemExit(f"{manifest_path} URL does not match version for {pack_id}: {pack['url']}")

              for pack_id in sorted(optional_gen5_ids & by_id.keys()):
                  pack = by_id[pack_id]
                  if pack.get("optional") is not True:
                      raise SystemExit(f"{manifest_path} gen5 pack must be optional: {pack_id}")
                  if pack.get("autoUpdateIfInstalled") is not True:
                      raise SystemExit(f"{manifest_path} gen5 pack must auto-update when installed: {pack_id}")

              print(f"Verified {manifest_path}")
          PY

      - name: Verify launcher release size
        run: |
          for file in builds/launcher/game-*.zip; do
            size="$(stat -c%s "${file}")"
            echo "${file}: ${size} bytes"
            if [ "${size}" -gt "${MAX_LAUNCHER_GAME_ZIP_BYTES}" ]; then
              echo "::error ::${file} is too large for launcher delivery."
              exit 1
            fi
          done

      - name: Upload launcher release to R2
        id: upload_r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_BUCKET}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "Skipping R2 upload because one or more R2 secrets are not configured."
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          game_artifact_id="${LAUNCHER_RELEASE_VERSION}-${CLIENT_BUILD_ID}"
          game_upload_args=(
            --file "game-${game_artifact_id}-windows.zip"
            --file "game-${game_artifact_id}-linux.zip"
          )
          if [ "${BUILD_MACOS}" = "true" ]; then
            game_upload_args+=(--file "game-${game_artifact_id}-macos.zip")
          fi
          python3 tools/upload_launcher_release.py builds/launcher \
            --layout updates \
            "${game_upload_args[@]}"

          cp "builds/launcher/game-${game_artifact_id}-windows.zip" builds/launcher/PokeAether-windows.zip
          cp "builds/launcher/game-${game_artifact_id}-linux.zip" builds/launcher/PokeAether-linux.zip
          if [ "${BUILD_MACOS}" = "true" ]; then
            cp "builds/launcher/game-${game_artifact_id}-macos.zip" builds/launcher/PokeAether-macos.zip
          fi
          python3 tools/upload_launcher_release.py builds/launcher \
            --prefix "game/latest" \
            --file PokeAether-windows.zip \
            --file PokeAether-linux.zip
          if [ "${BUILD_MACOS}" = "true" ]; then
            python3 tools/upload_launcher_release.py builds/launcher \
              --prefix "game/latest" \
              --file PokeAether-macos.zip
          fi
          if [ "${BUILD_LAUNCHER}" = "true" ]; then
            python3 tools/upload_launcher_release.py builds/launcher \
              --prefix "launcher/${LAUNCHER_RELEASE_VERSION}-${CLIENT_BUILD_ID}" \
              --file PokeAetherLauncher-windows.zip \
              --file PokeAetherLauncher-linux.zip
            if [ "${BUILD_MACOS}" = "true" ]; then
              python3 tools/upload_launcher_release.py builds/launcher \
                --prefix "launcher/${LAUNCHER_RELEASE_VERSION}-${CLIENT_BUILD_ID}" \
                --file PokeAetherLauncher-macos.zip
            fi
            python3 tools/upload_launcher_release.py builds/launcher \
              --prefix "launcher/latest" \
              --file PokeAetherLauncher-windows.zip \
              --file PokeAetherLauncher-linux.zip
            if [ "${BUILD_MACOS}" = "true" ]; then
              python3 tools/upload_launcher_release.py builds/launcher \
                --prefix "launcher/latest" \
                --file PokeAetherLauncher-macos.zip
            fi
          else
            echo "Skipping launcher download upload because BUILD_LAUNCHER=false."
          fi

          verify_args=()
          if [ "${BUILD_LAUNCHER}" = "true" ]; then
            verify_args+=(--include-launcher)
          fi
          python3 tools/verify_launcher_release_urls.py builds/launcher "${verify_args[@]}"

          manifest_upload_args=(
            --file manifest.json
            --file manifest-windows.json
            --file manifest-linux.json
          )
          if [ "${BUILD_MACOS}" = "true" ]; then
            manifest_upload_args+=(--file manifest-macos.json)
          fi
          python3 tools/upload_launcher_release.py builds/launcher "${manifest_upload_args[@]}"
          echo "published=true" >> "${GITHUB_OUTPUT}"

      - name: Post release announcement to Discord
        if: steps.upload_r2.outputs.published == 'true' && inputs.announce_discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "Skipping Discord announcement because DISCORD_WEBHOOK_URL is not configured."
            exit 0
          fi

          python3 tools/build_discord_release_payload.py \
            --version "${LAUNCHER_RELEASE_VERSION}" \
            --release-notes "${RELEASE_NOTES}" \
            > discord_payload.json

          curl -sS \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "${DISCORD_WEBHOOK_URL}"
