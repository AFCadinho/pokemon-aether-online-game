name: Build Browser Release Candidate (Preview)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Browser release version, for example 0.4.0-beta.1
        required: true
        type: string
      pages_project:
        description: Existing Cloudflare Pages project name
        required: true
        default: pokeaether-web
        type: string
      asset_base_url:
        description: Dedicated public HTTPS origin attached to the browser R2 bucket
        required: true
        default: https://web-assets.pokeaether.com
        type: string
      source_asset_base_url:
        description: Public HTTPS origin containing the immutable desktop source asset archives
        required: true
        default: https://updates.pokeaether.com
        type: string
      api_origin:
        description: Public HTTPS origin of the production gateway
        required: true
        default: https://api.pokeaether.com
        type: string
      size_exception:
        description: Allow a one-release browser payload exception, capped at 328 MiB
        required: true
        default: false
        type: boolean
      size_exception_reason:
        description: Required audit reason when size_exception is enabled
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: stable
  POKEMON_HOME_ASSET_VERSION: pokemon-home-a74442caa16b
  POKEMON_HOME_SHINY_ASSET_VERSION: pokemon-home-shiny-b7565d0885ae
  MUSIC_ASSET_VERSION: music-3f2a6df18793
  POKEMON_FRONT_ASSET_VERSION: pokemon-front-scale1-128-402b7a6cee88
  POKEMON_BACK_ASSET_VERSION: pokemon-back-scale1-128-6b78c3968c2f
  POKEMON_SHINY_FRONT_ASSET_VERSION: pokemon-shiny-front-scale1-128-066cf83cdfc7
  POKEMON_SHINY_BACK_ASSET_VERSION: pokemon-shiny-back-scale1-128-cb0b6ecfc3ef
  POKEMON_GEN5_FRONT_ASSET_VERSION: pokemon-gen5-front-895716cf7862
  POKEMON_GEN5_BACK_ASSET_VERSION: pokemon-gen5-back-2c6f2f001f7f
  POKEMON_GEN5_SHINY_FRONT_ASSET_VERSION: pokemon-gen5-shiny-front-a51df15dc1fd
  POKEMON_GEN5_SHINY_BACK_ASSET_VERSION: pokemon-gen5-shiny-back-e432df8479a4

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: web-production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          ASSET_BASE_URL: ${{ inputs.asset_base_url }}
          API_ORIGIN: ${{ inputs.api_origin }}
          PAGES_PROJECT: ${{ inputs.pages_project }}
          SIZE_EXCEPTION: ${{ inputs.size_exception }}
          SIZE_EXCEPTION_REASON: ${{ inputs.size_exception_reason }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Browser candidates must be built from main"
            exit 1
          fi
          if ! printf '%s' "${RELEASE_VERSION}" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}([-+][A-Za-z0-9._-]+)?$'; then
            echo "::error::release_version must look like 0.4.0 or 0.4.0-beta.1"
            exit 1
          fi
          python3 -c 'import sys, urllib.parse; values=sys.argv[1:]; assert all((u:=urllib.parse.urlsplit(v)).scheme == "https" and u.hostname and u.path in ("", "/") and not u.query and not u.fragment for v in values)' "${ASSET_BASE_URL}" "${API_ORIGIN}"
          if [[ ! "${PAGES_PROJECT}" =~ ^[a-z0-9-]{1,63}$ ]]; then
            echo "::error::pages_project is not a valid Cloudflare Pages project name"
            exit 1
          fi
          if [[ "${SIZE_EXCEPTION}" == "true" ]]; then
            if (( ${#SIZE_EXCEPTION_REASON} < 15 )); then
              echo "::error::A size exception requires an audit reason of at least 15 characters"
              exit 1
            fi
            echo "This candidate uses the explicitly requested 328 MiB one-release ceiling."
          elif [[ -n "${SIZE_EXCEPTION_REASON}" ]]; then
            echo "::error::size_exception_reason requires size_exception=true"
            exit 1
          fi
          echo "WEB_BUILD_ID=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          echo "PREVIEW_URL=https://rc.${PAGES_PROJECT}.pages.dev" >> "${GITHUB_ENV}"
          echo "PAGES_BRANCH=rc" >> "${GITHUB_ENV}"

      - name: Resolve active production browser build ID
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          response="$(curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${API_ORIGIN}/client-version?platform=web")"
          client_build_id="$(python3 -c 'import json,sys; value=json.load(sys.stdin); print(value.get("requiredBuild", ""))' <<<"${response}")"
          if [[ ! "${client_build_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::The production gateway did not return a valid active browser build ID"
            exit 1
          fi
          echo "PREVIEW_CLIENT_BUILD_ID=${client_build_id}" >> "${GITHUB_ENV}"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y rclone unzip ffmpeg

      - name: Download Godot and web export template
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          curl -fsSL -o export_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q export_templates.tpz -d /tmp/godot-export-templates
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mv /tmp/godot-export-templates/templates/* "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Restore required browser source assets
        env:
          SOURCE_ASSET_BASE_URL: ${{ inputs.source_asset_base_url }}
        run: |
          curl -fsSL -o /tmp/pokemon-home.zip "${SOURCE_ASSET_BASE_URL}/assets/${POKEMON_HOME_ASSET_VERSION}.zip"
          curl -fsSL -o /tmp/pokemon-home-shiny.zip "${SOURCE_ASSET_BASE_URL}/assets/${POKEMON_HOME_SHINY_ASSET_VERSION}.zip"
          curl -fsSL -o /tmp/music.zip "${SOURCE_ASSET_BASE_URL}/assets/${MUSIC_ASSET_VERSION}.zip"
          unzip -oq /tmp/pokemon-home.zip
          unzip -oq /tmp/pokemon-home-shiny.zip
          unzip -oq /tmp/music.zip

      - name: Import, verify and export Godot web client
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SIZE_EXCEPTION: ${{ inputs.size_exception }}
          SIZE_EXCEPTION_REASON: ${{ inputs.size_exception_reason }}
        run: |
          python3 tools/stamp_godot_version.py --project project.godot --export-presets export_presets.cfg \
            --version "${RELEASE_VERSION}" --web-build-id "${WEB_BUILD_ID}"
          ./godot --headless --import --quit
          ./godot --headless --path . --script res://tests/generated_map_texture_storage_check.gd
          build_args=(python3 tools/build_web_preview.py --godot ./godot)
          if [[ "${SIZE_EXCEPTION}" == "true" ]]; then
            build_args+=(--allow-size-exception --size-exception-reason "${SIZE_EXCEPTION_REASON}")
          fi
          "${build_args[@]}"
          python3 tools/build_web_asset_modules.py --godot ./godot

      - name: Package Pages and R2 release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          ASSET_BASE_URL: ${{ inputs.asset_base_url }}
        run: |
          package_web() {
            pages_dir="$1"
            r2_dir="$2"
            web_url="$3"
            asset_base_url="$4"
            client_build_id="$5"
            python3 tools/package_web_release.py \
              --build-id "${WEB_BUILD_ID}" --release-version "${RELEASE_VERSION}" \
              --client-build-id "${client_build_id}" \
              --web-url "${web_url}" --asset-base-url "${asset_base_url}" \
              --sprite-animated-front-version "${POKEMON_FRONT_ASSET_VERSION}" \
              --sprite-animated-back-version "${POKEMON_BACK_ASSET_VERSION}" \
              --sprite-animated-shiny-front-version "${POKEMON_SHINY_FRONT_ASSET_VERSION}" \
              --sprite-animated-shiny-back-version "${POKEMON_SHINY_BACK_ASSET_VERSION}" \
              --sprite-pixel-front-version "${POKEMON_GEN5_FRONT_ASSET_VERSION}" \
              --sprite-pixel-back-version "${POKEMON_GEN5_BACK_ASSET_VERSION}" \
              --sprite-pixel-shiny-front-version "${POKEMON_GEN5_SHINY_FRONT_ASSET_VERSION}" \
              --sprite-pixel-shiny-back-version "${POKEMON_GEN5_SHINY_BACK_ASSET_VERSION}" \
              --pages-dir "${pages_dir}" --r2-dir "${r2_dir}"
          }
          package_web builds/web-pages-production builds/web-r2 \
            https://play.pokeaether.com "${ASSET_BASE_URL}" "${WEB_BUILD_ID}"
          package_web builds/web-pages-preview builds/web-r2-preview \
            "${PREVIEW_URL}" "${PREVIEW_URL}" "${PREVIEW_CLIENT_BUILD_ID}"

      - name: Install browser and Cloudflare tooling
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run release-focused checks
        run: |
          python3 -m unittest tests.test_package_web_release tests.test_publish_web_sprite_catalog
          node tests/web_cloudflare_function_test.mjs
          ./godot --headless --path . --script res://tests/web_runtime_check.gd
          ./godot --headless --path . --script res://tests/web_dynamic_pokemon_sprite_check.gd
          python3 tools/serve_web_preview.py >/tmp/pokeaether-web-preview.log 2>&1 &
          preview_pid="$!"
          trap 'kill "${preview_pid}" 2>/dev/null || true' EXIT
          node tests/web_preview_browser_smoke.cjs

      - name: Upload immutable runtime to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 tools/upload_web_release.py builds/web-r2 --verify-only
          python3 tools/upload_web_release.py builds/web-r2

      - name: Verify R2 CORS is ready
        env:
          WEB_URL: https://play.pokeaether.com
          ASSET_BASE_URL: ${{ inputs.asset_base_url }}
        run: |
          headers="$(curl -fsSI -H "Origin: ${WEB_URL}" "${ASSET_BASE_URL}/web/releases/${WEB_BUILD_ID}/index.wasm")"
          printf '%s\n' "${headers}" | tr -d '\r' | grep -Fiqx "access-control-allow-origin: ${WEB_URL%/}"

      - name: Publish browser sprite catalogs when absent
        env:
          ASSET_BASE_URL: ${{ inputs.asset_base_url }}
          SOURCE_ASSET_BASE_URL: ${{ inputs.source_asset_base_url }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          bash tools/publish_web_sprite_catalog.sh animated front "${POKEMON_FRONT_ASSET_VERSION}"
          bash tools/publish_web_sprite_catalog.sh animated back "${POKEMON_BACK_ASSET_VERSION}"
          bash tools/publish_web_sprite_catalog.sh animated shiny_front "${POKEMON_SHINY_FRONT_ASSET_VERSION}"
          bash tools/publish_web_sprite_catalog.sh animated shiny_back "${POKEMON_SHINY_BACK_ASSET_VERSION}"
          bash tools/publish_web_sprite_catalog.sh pixel front "${POKEMON_GEN5_FRONT_ASSET_VERSION}"
          bash tools/publish_web_sprite_catalog.sh pixel back "${POKEMON_GEN5_BACK_ASSET_VERSION}"
          bash tools/publish_web_sprite_catalog.sh pixel shiny_front "${POKEMON_GEN5_SHINY_FRONT_ASSET_VERSION}"
          bash tools/publish_web_sprite_catalog.sh pixel shiny_back "${POKEMON_GEN5_SHINY_BACK_ASSET_VERSION}"

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ inputs.pages_project }}
          API_ORIGIN: ${{ inputs.api_origin }}
          ASSET_BASE_URL: ${{ inputs.asset_base_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('wrangler.jsonc')
          config = json.loads(path.read_text(encoding='utf-8'))
          config['vars']['API_ORIGIN'] = os.environ['API_ORIGIN'].rstrip('/')
          config['vars']['ASSET_BASE_URL'] = os.environ['ASSET_BASE_URL'].rstrip('/')
          config['pages_build_output_dir'] = 'builds/web-pages-preview'
          path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')
          PY
          npx wrangler pages deploy builds/web-pages-preview --project-name "${PAGES_PROJECT}" --branch "${PAGES_BRANCH}" --commit-dirty=true

      - name: Verify public release files
        env:
          ASSET_BASE_URL: ${{ inputs.asset_base_url }}
        run: |
          WEB_URL="${PREVIEW_URL}"
          public_index="$(mktemp)"
          trap 'rm -f "${public_index}"' EXIT
          deadline=$((SECONDS + 180))
          until curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -o "${public_index}" "${WEB_URL}/" \
            && grep -Fq "${WEB_BUILD_ID}" "${public_index}"; do
            if (( SECONDS >= deadline )); then
              echo "Pages did not expose build ${WEB_BUILD_ID} on ${WEB_URL} within 180 seconds" >&2
              exit 1
            fi
            sleep 5
          done
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsSI \
            "${WEB_URL}/web/releases/${WEB_BUILD_ID}/index.wasm" | grep -Eiq '^content-type: application/wasm'
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsS \
            "${WEB_URL}/pokemon-assets/battle/${POKEMON_FRONT_ASSET_VERSION}/pikachu/animation.json" \
            | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value.get("frames")'
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsSI \
            "${WEB_URL}/pokemon-assets/battle/${POKEMON_FRONT_ASSET_VERSION}/pikachu/sheet.png" \
            | grep -Eiq '^content-type: image/png'
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsS \
            "${WEB_URL}/pokemon-assets/gen5/${POKEMON_GEN5_FRONT_ASSET_VERSION}/pikachu/animation.json" \
            | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value.get("frames")'
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsSI \
            "${WEB_URL}/pokemon-assets/gen5/${POKEMON_GEN5_FRONT_ASSET_VERSION}/pikachu/sheet.png" \
            | grep -Eiq '^content-type: image/png'

      - name: Assemble promotable candidate artifact
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          mkdir -p builds/browser-candidate/r2
          cp -a builds/web-pages-production builds/browser-candidate/pages-production
          cp builds/web-r2/web-release.json builds/browser-candidate/r2/web-release.json
          cp builds/web-r2/manifest-web.json builds/browser-candidate/r2/manifest-web.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = {
              'runId': os.environ['GITHUB_RUN_ID'],
              'sourceSha': os.environ['GITHUB_SHA'],
              'buildId': os.environ['WEB_BUILD_ID'],
              'releaseVersion': os.environ['RELEASE_VERSION'],
              'previewClientBuildId': os.environ['PREVIEW_CLIENT_BUILD_ID'],
          }
          Path('builds/browser-candidate/candidate.json').write_text(
              json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: browser-release-candidate-${{ github.run_id }}
          path: builds/browser-candidate
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview instructions
        run: |
          {
            echo "## Browser release candidate is ready for testing"
            echo
            echo "- Preview: ${PREVIEW_URL}"
            echo "- Build ID: ${WEB_BUILD_ID}"
            echo "- Candidate run ID: ${GITHUB_RUN_ID}"
            echo "- Production manifest: unchanged"
            echo
            echo "Test the preview using the release matrix in infrastructure/web/README.md."
          } >> "${GITHUB_STEP_SUMMARY}"
