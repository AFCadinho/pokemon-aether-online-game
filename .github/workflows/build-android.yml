name: Build Android release candidate

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android release version
        default: "0.3.87"
        required: true
        type: string
      version_code:
        description: New integer Android version code (next release uses 5)
        default: 5
        required: true
        type: number

concurrency:
  group: build-android-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: stable
  SOURCE_ASSET_BASE_URL: https://updates.pokeaether.com
  POKEMON_HOME_ASSET_VERSION: pokemon-home-a74442caa16b
  POKEMON_HOME_ASSET_SIZE: 60842557
  POKEMON_HOME_ASSET_SHA256: a7ead89ba95443e9a1326080a6ec8cc1270af99ba8d8776c4d184ac6a0916a33
  POKEMON_HOME_SHINY_ASSET_VERSION: pokemon-home-shiny-b7565d0885ae
  POKEMON_HOME_SHINY_ASSET_SIZE: 33195703
  POKEMON_HOME_SHINY_ASSET_SHA256: 45dafaee8c4a1ce72e5efaea93d716d17b2ab334824a95c60a78b28c62736293
  MUSIC_ASSET_VERSION: music-3f2a6df18793
  MUSIC_ASSET_SIZE: 49402952
  MUSIC_ASSET_SHA256: 0b1a376bd7d93e31a72b8b6a49116415f8ec0c6316bf5e1a71f766857119e31a

jobs:
  build:
    name: Export signed ARM64 APK for review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          : "${ANDROID_HOME:?Android SDK is required on the runner}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' \
            'cmake;3.10.2.4988404' 'ndk;28.1.13356709'

      - name: Install Godot 4.6.2 and export templates
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          curl -fsSL -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "${template_dir}"
          mv /tmp/godot-templates/templates/* "${template_dir}/"
          python3 android_updater/setup_build_template.py "${template_dir}/android_source.zip"
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF

      - name: Restore required music for Godot import
        run: |
          curl -fsSL -o /tmp/pokeaether-music.zip "https://updates.pokeaether.com/assets/${MUSIC_ASSET_VERSION}.zip"
          echo "${MUSIC_ASSET_SHA256}  /tmp/pokeaether-music.zip" | sha256sum --check --strict
          test "$(stat -c %s /tmp/pokeaether-music.zip)" = "${MUSIC_ASSET_SIZE}"
          unzip -oq /tmp/pokeaether-music.zip

      - name: Restore Pokémon HOME icons for Android
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pokemon-home.zip "${SOURCE_ASSET_BASE_URL}/assets/${POKEMON_HOME_ASSET_VERSION}.zip"
          curl -fsSL -o /tmp/pokemon-home-shiny.zip "${SOURCE_ASSET_BASE_URL}/assets/${POKEMON_HOME_SHINY_ASSET_VERSION}.zip"
          echo "${POKEMON_HOME_ASSET_SHA256}  /tmp/pokemon-home.zip" | sha256sum --check --strict
          echo "${POKEMON_HOME_SHINY_ASSET_SHA256}  /tmp/pokemon-home-shiny.zip" | sha256sum --check --strict
          test "$(stat -c %s /tmp/pokemon-home.zip)" = "${POKEMON_HOME_ASSET_SIZE}"
          test "$(stat -c %s /tmp/pokemon-home-shiny.zip)" = "${POKEMON_HOME_SHINY_ASSET_SIZE}"
          unzip -oq /tmp/pokemon-home.zip
          unzip -oq /tmp/pokemon-home-shiny.zip
          test -f assets/sprites/pokemon/pokemon_home/Pikachu.png
          test -f assets/sprites/pokemon/pokemon_home/Bulbasaur.png
          test -f assets/sprites/pokemon/pokemon_home_shiny/pikachu.png

      - name: Generate on-demand cry availability
        run: python3 tools/prepare_android_assets.py

      - name: Stamp immutable release identity
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          echo "ANDROID_BUILD_ID=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen
          def read(url):
              with urlopen(Request(url, headers={'User-Agent': 'PokeAetherAndroidCandidate/1.0', 'Cache-Control': 'no-cache'}), timeout=30) as response:
                  return json.load(response)
          game = read('https://updates.pokeaether.com/manifest-android.json')['game']
          compatible = str(game['buildId'])
          assert re.fullmatch(r'[A-Za-z0-9._-]{1,120}', compatible)
          assert int(os.environ['VERSION_CODE']) > int(game['versionCode'])
          assert read('https://api.pokeaether.com/client-version?platform=android')['requiredBuild'] == compatible
          Path('/tmp/android-compatible-build.txt').write_text(compatible)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_TEST_COMPATIBLE_BUILD_ID={compatible}\n')
          PY
          compatible_build="$(cat /tmp/android-compatible-build.txt)"
          python3 tools/android_release.py prepare \
            --version "${VERSION_NAME}" --code "${VERSION_CODE}" \
            --build-id "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --compatible-build-id "${compatible_build}"

      - name: Import Godot assets and run Android checks
        run: |
          set -o pipefail
          ./godot --headless --import --quit >/tmp/godot-import-first.log 2>&1 || true
          ./godot --headless --import --quit 2>&1 | tee /tmp/godot-import.log
          ./godot --headless --path . --script res://tests/android_apk_update_check.gd
          ./godot --headless --path . --script res://tests/android_home_sprite_pack_check.gd
          ./godot --headless --path . --script res://tests/android_music_pack_check.gd
          ./godot --headless --path . --script res://tests/mobile_asset_cache_check.gd
          python3 tools/check_mobile_assets.py --godot ./godot

      - name: Export with the pinned release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing Android release keystore secret}"
          : "${GODOT_ANDROID_KEYSTORE_RELEASE_USER:?Missing Android key alias}"
          : "${GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD:?Missing Android key password}"
          umask 077
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="${RUNNER_TEMP}/pokeaether-release.keystore"
          trap 'rm -f "${GODOT_ANDROID_KEYSTORE_RELEASE_PATH}"' EXIT
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${GODOT_ANDROID_KEYSTORE_RELEASE_PATH}"
          mkdir -p builds/android
          ./godot --headless --export-release "Android Internal Alpha" \
            builds/android/PokeAether-alpha.apk

      - name: Verify APK and create review manifest
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          : "${RELEASE_CERT_SHA256:?Missing pinned Android signing certificate}"
          python3 tools/check_android_demand_export.py builds/android/PokeAether-alpha.apk
          mkdir -p release
          mv builds/android/PokeAether-alpha.apk "release/game-${ANDROID_BUILD_ID}-android.apk"
          python3 tools/android_release.py inspect \
            --apk "release/game-${ANDROID_BUILD_ID}-android.apk" \
            --aapt "${ANDROID_HOME}/build-tools/35.0.1/aapt" \
            --apksigner "${ANDROID_HOME}/build-tools/35.0.1/apksigner" \
            --version "${VERSION_NAME}" --code "${VERSION_CODE}" \
            --build-id "${ANDROID_BUILD_ID}" \
            --compatible-build-id "${ANDROID_TEST_COMPATIBLE_BUILD_ID}" \
            --certificate "${RELEASE_CERT_SHA256}" \
            --output release/manifest-android.json

      - name: Retain private release candidate
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare matching Android asset payload
        run: python3 tools/prepare_android_assets.py --asset-output builds/android-assets

      - name: Retain matching Android assets
        uses: actions/upload-artifact@v4
        with:
          name: android-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: builds/android-assets/
          if-no-files-found: error
          retention-days: 30
